<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>人工智能训练师三级 · 刷题系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#4F46E5;--pri2:#6366F1;--bg:#F0F2F5;--card:#fff;--text:#1F2937;--sub:#6B7280;--green:#10B981;--red:#EF4444;--orange:#F59E0B;--border:#E5E7EB;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:70px;-webkit-tap-highlight-color:transparent}
.header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:16px 20px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(79,70,229,.3)}
.header h1{font-size:18px;font-weight:700;letter-spacing:1px}
.header .sub{font-size:12px;opacity:.8;margin-top:4px}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:56px;z-index:99}
.tab{flex:1;text-align:center;padding:12px 0;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;transition:.2s}
.tab.active{color:var(--pri);border-bottom-color:var(--pri)}
.container{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-title{font-size:15px;font-weight:700;color:var(--pri);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;color:#fff}
.badge-j{background:#F59E0B}.badge-s{background:#3B82F6}.badge-m{background:#8B5CF6}
.q-num{color:var(--pri);font-weight:700;font-size:13px;margin-bottom:8px}
.q-text{font-size:15px;line-height:1.7;margin-bottom:14px;color:var(--text)}
.opt{padding:12px 14px;border:2px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:14px;line-height:1.5;transition:.15s;display:flex;align-items:flex-start;gap:10px;-webkit-user-select:none;user-select:none}
.opt:active{transform:scale(.98)}
.opt .letter{min-width:24px;height:24px;border-radius:50%;background:#F3F4F6;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sub);flex-shrink:0;transition:.15s}
.opt.selected{border-color:var(--pri);background:#EEF2FF}
.opt.selected .letter{background:var(--pri);color:#fff}
.opt.correct{border-color:var(--green);background:#ECFDF5}
.opt.correct .letter{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#FEF2F2}
.opt.wrong .letter{background:var(--red);color:#fff}
.opt.missed{border-color:var(--orange);background:#FFFBEB}
.opt.missed .letter{background:var(--orange);color:#fff}
.opt.disabled{pointer-events:none;opacity:.95}
.judge-opts{display:flex;gap:10px;margin-bottom:14px}
.judge-btn{flex:1;padding:14px;border:2px solid var(--border);border-radius:10px;text-align:center;font-size:16px;font-weight:700;cursor:pointer;transition:.15s}
.judge-btn:active{transform:scale(.97)}
.judge-btn.selected{border-color:var(--pri);background:#EEF2FF;color:var(--pri)}
.judge-btn.correct{border-color:var(--green);background:#ECFDF5;color:var(--green)}
.judge-btn.wrong{border-color:var(--red);background:#FEF2F2;color:var(--red)}
.judge-btn.disabled{pointer-events:none}
.result-box{padding:12px 14px;border-radius:10px;margin-top:10px;font-size:13px;line-height:1.6}
.result-box.correct{background:#ECFDF5;color:#065F46;border-left:4px solid var(--green)}
.result-box.wrong{background:#FEF2F2;color:#991B1B;border-left:4px solid var(--red)}
.explain-box{padding:12px 14px;border-radius:10px;margin-top:8px;font-size:13px;line-height:1.7;background:#F0F5FF;color:#1e3a5f;border-left:4px solid #3B82F6}
.explain-box .explain-title{font-weight:700;margin-bottom:4px;color:#1e40af}
.sync-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;transition:.15s}
.sync-badge.ok{background:#ECFDF5;color:#065F46}
.sync-badge.warn{background:#FFFBEB;color:#92400E}
.sync-badge.err{background:#FEF2F2;color:#991B1B}
.sync-badge.off{background:#F3F4F6;color:#6B7280}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:16px;padding:24px;max-width:400px;width:90%;box-shadow:0 8px 30px rgba(0,0,0,.15)}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-spin{display:inline-block;animation:spin .8s linear infinite}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(40px)}}
.sync-toast{position:fixed;top:80px;right:16px;background:#10B981;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:300;animation:slideIn .3s ease;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(16,185,129,.4)}
.sync-toast.err{background:#EF4444;box-shadow:0 4px 16px rgba(239,68,68,.4)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 24px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:.15s;gap:6px}
.btn:active{transform:scale(.97)}
.btn-pri{background:var(--pri);color:#fff}.btn-pri:hover{background:var(--pri2)}
.btn-out{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-sm{padding:8px 16px;font-size:13px}
.btn-block{display:flex;width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-card{text-align:center;padding:14px 8px;background:#F9FAFB;border-radius:10px}
.stat-num{font-size:24px;font-weight:800;color:var(--pri)}
.stat-label{font-size:11px;color:var(--sub);margin-top:4px}
.progress-bar{height:6px;background:#E5E7EB;border-radius:3px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:3px;transition:.3s}
.type-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;border:2px solid var(--border);cursor:pointer;transition:.15s;background:#fff}
.filter-btn.active{border-color:var(--pri);background:#EEF2FF;color:var(--pri)}
.exam-card{padding:16px;border-radius:var(--radius);margin-bottom:10px;cursor:pointer;transition:.15s;background:#fff;border:2px solid var(--border)}
.exam-card:active{transform:scale(.99)}
.exam-card.official{border-color:var(--orange);background:linear-gradient(135deg,#FFFBEB,#FEF3C7)}
.exam-card .exam-title{font-size:15px;font-weight:700;color:var(--text)}
.exam-card .exam-info{font-size:12px;color:var(--sub);margin-top:4px}
.timer{position:fixed;top:60px;right:12px;background:var(--red);color:#fff;padding:6px 12px;border-radius:20px;font-size:14px;font-weight:700;z-index:101;box-shadow:0 2px 8px rgba(239,68,68,.3)}
.timer.warn{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.nav-btns{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
.q-nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.q-dot{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;transition:.15s}
.q-dot.done{background:#ECFDF5;border-color:var(--green);color:var(--green)}
.q-dot.wrong-dot{background:#FEF2F2;border-color:var(--red);color:var(--red)}
.q-dot.current{background:var(--pri);color:#fff;border-color:var(--pri)}
.empty-state{text-align:center;padding:40px 20px;color:var(--sub)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:14px;line-height:1.6}
.confirm-btn{margin-top:12px}
.score-display{text-align:center;padding:30px}
.score-big{font-size:64px;font-weight:900;color:var(--pri)}
.score-label{font-size:14px;color:var(--sub);margin-top:8px}
.multi-hint{font-size:12px;color:var(--orange);margin-bottom:8px;font-weight:600}
.back-btn{position:absolute;left:16px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:20px;opacity:.9}
.header-wrap{position:relative}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}.q-text{font-size:14px}.opt{padding:10px 12px;font-size:13px}}
.fade-in{animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.exam-result-detail{max-height:60vh;overflow-y:auto}
.hidden{display:none!important}
.q-dot.marked{border-color:var(--orange);box-shadow:0 0 0 2px rgba(245,158,11,.3)}
.btn-orange{background:var(--orange);color:#fff}
.btn-orange.active{background:#D97706}
.q-nav-section{margin-bottom:12px}
.q-nav-section .section-label{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;padding:2px 8px;background:#F3F4F6;border-radius:6px;display:inline-block}
.stat-card.active-filter{border:2px solid var(--pri);background:#EEF2FF}
.stat-card{cursor:pointer;transition:.15s;border:2px solid transparent}
.stat-card:hover{border-color:var(--border)}
.review-correct{border-left:4px solid var(--green);background:#ECFDF5}
.review-wrong{border-left:4px solid var(--red);background:#FEF2F2}
.review-unanswered{border-left:4px solid var(--border);background:#F9FAFB}

/* Sidebar + bank layout */
.bank-layout{display:flex;gap:0;max-width:960px;margin:0 auto;padding:12px;align-items:flex-start}
.bank-sidebar{width:130px;flex-shrink:0;position:sticky;top:108px;max-height:calc(100vh - 120px);overflow-y:auto;margin-right:12px;border-radius:var(--radius);background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.06);padding:8px 6px}
.bank-sidebar::-webkit-scrollbar{width:3px}.bank-sidebar::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:2px}
.sidebar-title{font-size:11px;font-weight:700;color:var(--sub);padding:4px 6px 8px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);margin-bottom:6px}
.sidebar-item{display:block;padding:7px 8px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:3px;transition:.15s;color:var(--text);border:1.5px solid transparent;line-height:1.3}
.sidebar-item:hover{background:#F3F4F6}
.sidebar-item.active{background:#EEF2FF;color:var(--pri);border-color:var(--pri)}
.sidebar-item .s-progress{height:3px;background:#E5E7EB;border-radius:2px;margin-top:4px;overflow:hidden}
.sidebar-item .s-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--green),#34D399);transition:.3s}
.sidebar-item.all-done .s-fill{background:linear-gradient(90deg,var(--green),#34D399)}
.bank-main{flex:1;min-width:0}
/* Mobile: sidebar becomes top horizontal scroll */
@media(max-width:600px){
  .bank-layout{flex-direction:column;padding:8px}
  .bank-sidebar{width:100%;position:static;max-height:none;overflow-x:auto;overflow-y:hidden;white-space:nowrap;display:flex;flex-wrap:nowrap;gap:6px;padding:8px;margin-right:0;margin-bottom:10px;border-radius:var(--radius)}
  .sidebar-title{display:none}
  .sidebar-item{display:inline-flex;flex-direction:column;align-items:center;margin-bottom:0;min-width:60px;text-align:center;white-space:normal}
  .sidebar-item .s-progress{width:44px}
}

/* Per-question accuracy badge */
.q-accuracy{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;margin-left:8px}
.q-accuracy.high{background:#ECFDF5;color:#065F46}
.q-accuracy.mid{background:#FFFBEB;color:#92400E}
.q-accuracy.low{background:#FEF2F2;color:#991B1B}
.q-accuracy.none{background:#F3F4F6;color:var(--sub)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KB={"kb_ethics":{"title":"职业道德概述","category":"职业道德与法规","content":"职业道德是指从事一定职业的人在工作中应当遵守的行为规范。它不是法律，但比法律更广泛——法律管的是“不能做什么”，职业道德管的是“应该做什么”。比如医生要对患者保密、会计要做假账要举报、程序员不能留后门。职业道德的核心是：诚信、责任、保密、专业。对于AI训练师来说，职业道德意味着要保证数据标注的公正性、不泄露训练数据中的隐私信息、不故意让模型产生偏见。违反职业道德虽然不会坐牢，但会丢掉行业口碑和工作机会。","keywords":["职业道德","诚信","责任","保密","专业"]},"kb_moral_eval":{"title":"道德评价","category":"职业道德与法规","content":"道德评价就是判断一个人的行为“对不对”——不是法律上的对不对，而是道德上的对不对。判断标准有三个：①是否符合社会公德（大家普遍认可的行为准则）；②是否符合职业道德（行业规范）；③是否损害他人利益。道德评价的方式有社会舆论、传统习惯和内心信念。比如有人用AI换脸恶搞别人，虽然可能不违法，但社会舆论会谴责，这就是道德评价在起作用。道德评价和法律评价的区别在于：道德评价没有强制力，但覆盖面更广。","keywords":["道德评价","社会公德","道德标准","社会舆论"]},"kb_labor_contract":{"title":"劳动合同法基础","category":"职业道德与法规","content":"《劳动合同法》保护劳动者的权益。签劳动合同时必须包含这些内容：①合同期限（固定期限/无固定期限/完成一定工作任务）；②工作内容和工作地点；③工作时间和休息休假；④劳动报酬（工资怎么算、什么时候发）；⑤社会保险；⑥劳动保护和劳动条件。试用期也有规定：合同1年以下试用期不超过1个月，1-3年不超过2个月，3年以上不超过6个月。用人单位不能随便扣工资、不能随意延长工作时间、不能收押金。这些是劳动者的基本权利，AI训练师作为从业者也需要了解。","keywords":["劳动合同","试用期","劳动报酬","社会保险","劳动者权益"]},"kb_ip":{"title":"知识产权基础","category":"职业道德与法规","content":"知识产权是指智力成果的专有权利，主要包括三大类：①专利权——保护发明创造，需要向国家知识产权局申请，有效期20年（发明）或10年（实用新型/外观设计）；②著作权——保护文学、艺术、科学作品，自创作完成自动产生，无需登记，保护期一般是作者终生加死后50年；③商标权——保护品牌标识，需要注册，有效期10年但可续展。在AI领域，知识产权问题很常见：AI生成的文章有著作权吗？用别人的图片训练模型算侵权吗？这些问题目前还在法律灰色地带，但基本原则是——商业使用他人成果需要获得授权。","keywords":["知识产权","专利权","著作权","商标权","发明创造"]},"kb_copyright":{"title":"著作权详解","category":"职业道德与法规","content":"著作权（也叫版权）保护的是“表达”，不是“想法”。比如你写了一篇关于AI的文章，文章的表达（文字、结构）受著作权保护，但文章里的观点和想法不受保护——别人可以用自己的话表达同样的观点。著作权自作品创作完成之日起自动产生，不需要去登记。但登记有个好处：打官司时更容易证明作品是你的。著作权的保护期：自然人作品是作者终生加死后50年；法人作品是发表后50年。对于AI训练师，要注意的是：标注数据时不能直接复制受版权保护的内容，爬虫抓取数据时要遵守网站的robots协议。","keywords":["著作权","版权","作品","保护期","robots协议"]},"kb_patent":{"title":"专利制度","category":"职业道德与法规","content":"专利是国家授予发明人在一定期限内对其发明创造的独占权。要获得专利，发明必须满足三个条件：①新颖性——之前没人公开过；②创造性——不是显而易见的改进；③实用性——能实际应用。专利分三种：发明专利（保护期20年）、实用新型专利（10年）、外观设计专利（15年）。专利申请流程：提交申请→初步审查→公开→实质审查→授权。在AI领域，算法本身不能申请专利（属于智力活动规则），但“算法+技术方案”可以申请，比如“一种基于CNN的图像识别方法”。","keywords":["专利","新颖性","创造性","实用性","发明专利","实用新型"]},"kb_cybersecurity_law":{"title":"网络安全法","category":"职业道德与法规","content":"《网络安全法》2017年实施，是网络空间安全管理的基本法。核心要求：①网络运营者必须保护用户信息，不能泄露、篡改、损毁；②收集个人信息要明示目的、方式和范围，经用户同意；③发现安全漏洞要及时报告；④关键信息基础设施运营者要把重要数据存在境内（数据本地化）。违反网络安全法的处罚：拒不改正的可罚款1-10万元，情节严重的可罚款10-100万元，直接负责人可罚款1-10万元。对AI训练师来说，处理训练数据时要注意数据来源合法性，不能非法获取个人信息。","keywords":["网络安全法","网络运营者","个人信息","数据本地化","安全漏洞"]},"kb_privacy_law":{"title":"个人信息保护法","category":"职业道德与法规","content":"《个人信息保护法》2021年实施，被称为中国版的“GDPR”。核心原则：①合法、正当、必要——收集信息必须有正当理由，不能多收；②知情同意——要告诉用户收集什么、怎么用，用户同意后才能收集；③最小必要——只收集完成目的所需的最少信息；④用户有权撤回同意、要求删除。特别保护的敏感信息包括：生物识别（人脸、指纹）、宗教信仰、医疗健康、金融账户、行踪轨迹、未成年人信息。处理敏感信息需要单独同意。AI训练师在标注人脸、语音等数据时，必须确保数据来源合法且获得了本人同意。","keywords":["个人信息保护法","知情同意","最小必要","敏感信息","数据删除"]},"kb_ml":{"title":"机器学习入门","category":"AI基础","content":"机器学习是让计算机从数据中自动学习规律的方法。传统编程是人告诉计算机规则（if-then），机器学习是让计算机自己从数据中发现规则。举个例子：判断邮件是否是垃圾邮件。传统方法需要人工写规则（包含“中奖”→垃圾邮件），机器学习方法是给计算机看1000封邮件（标注了哪些是垃圾邮件），让它自己学出判断标准。机器学习分三大类：①监督学习——有标签数据，学输入到输出的映射（如分类、回归）；②无监督学习——没标签数据，发现数据中的模式（如聚类、降维）；③强化学习——通过试错学习，像训练小狗一样，做对了给奖励。","keywords":["机器学习","监督学习","无监督学习","强化学习","分类","回归","聚类"]},"kb_deep_learning":{"title":"深度学习","category":"AI基础","content":"深度学习是机器学习的一个子领域，使用多层神经网络来处理复杂数据。“深度”指的是网络层数多——通常有几十甚至上百层。为什么需要深度？因为浅层网络只能学到简单特征（比如边缘、颜色），深层网络能学到复杂特征（比如眼睛、脸、表情）。深度学习的突破发生在2012年，AlexNet在图像识别比赛中大幅领先传统方法。之后深度学习席卷了AI各个领域：图像识别用CNN，自然语言处理用Transformer，语音识别用RNN/Transformer。深度学习需要大量数据和算力（GPU），这也是为什么数据标注和云计算对AI如此重要。","keywords":["深度学习","神经网络","CNN","Transformer","GPU","AlexNet"]},"kb_supervised":{"title":"监督学习","category":"AI基础","content":"监督学习是最常见的机器学习方法，核心思想是：给计算机看“题目和答案”，让它学会做题。训练数据必须有标签（正确答案），比如图片标注了“猫”或“狗”，邮件标注了“垃圾”或“正常”。监督学习分两类：①分类——预测结果是离散类别（如猫/狗、垃圾/正常）；②回归——预测结果是连续数值（如房价、温度）。常见算法：线性回归、逻辑回归、决策树、随机森林、SVM、神经网络。评估指标：准确率（答对多少）、精确率（预测为正的有多少真是正）、召回率（真正的正例找回了多少）、F1值（精确率和召回率的调和平均）。","keywords":["监督学习","分类","回归","标签","准确率","精确率","召回率","F1"]},"kb_unsupervised":{"title":"无监督学习","category":"AI基础","content":"无监督学习是让计算机在没有标签的数据中自己发现规律。就像给小孩一堆积木，没人告诉他怎么分类，他可能按颜色分、按形状分——这就是无监督学习。主要方法：①聚类——把相似的数据分成一组，如K-Means算法将用户分成不同群体；②降维——把高维数据压缩到低维，方便可视化和减少计算量，如PCA主成分分析；③关联规则——发现数据中的关联关系，如“买啤酒的人 often 买尿布”（经典案例）。无监督学习的难点是：没有标准答案，评估起来很主观。在AI训练师的工作中，数据探索阶段常用无监督学习来了解数据的分布和结构。","keywords":["无监督学习","聚类","K-Means","降维","PCA","关联规则"]},"kb_reinforcement":{"title":"强化学习","category":"AI基础","content":"强化学习是让AI通过与环境交互来学习最优策略的方法。想象训练一只狗：坐下给零食（奖励），乱叫不给（惩罚），狗慢慢学会该怎么做。强化学习的核心概念：①智能体（Agent）——学习者；②环境——智能体所处的世界；③状态——当前情况；④动作——智能体的选择；⑤奖励——做对了得正分，做错了得负分。目标是最大化累积奖励。著名应用：AlphaGo下围棋、机器人走路、游戏AI。强化学习和监督学习的区别：监督学习有标准答案，强化学习只有奖励信号，需要自己探索。","keywords":["强化学习","智能体","环境","奖励","策略","AlphaGo"]},"kb_transfer_learning":{"title":"迁移学习","category":"AI基础","content":"迁移学习的核心思想是：把在一个任务上学到的知识，应用到另一个相关任务上。就像一个会弹钢琴的人学吉他会更快——因为乐理知识是相通的。在AI中，迁移学习的典型做法是：用在大数据集（如ImageNet有1400万图片）上预训练好的模型，稍微调整一下就能用在自己的小数据集上。好处：①节省训练时间和计算资源；②在小数据集上也能取得好效果；③不需要从零开始。常见的迁移学习场景：用预训练的BERT做文本分类、用预训练的ResNet做图像识别。AI训练师在实际工作中，经常使用迁移学习来快速构建模型。","keywords":["迁移学习","预训练","微调","BERT","ResNet","ImageNet"]},"kb_ensemble":{"title":"集成学习","category":"AI基础","content":"集成学习的思路是“三个臭皮匠赛过诸葛亮”——把多个弱模型组合成一个强模型。主要方法：①Bagging——并行训练多个模型，投票决定最终结果，代表是随机森林（Random Forest）；②Boosting——串行训练，每个新模型重点学习前面模型犯的错，代表有XGBoost、LightGBM、AdaBoost；③Stacking——用一个元模型来组合多个基模型的预测结果。集成学习为什么有效？因为不同模型会犯不同的错误，组合起来错误就抵消了。在实际竞赛中（如Kaggle），集成学习几乎是获胜的标配。AI训练师需要了解集成学习的原理，以便在实际项目中选择合适的模型策略。","keywords":["集成学习","Bagging","Boosting","随机森林","XGBoost","AdaBoost"]},"kb_neural_network":{"title":"神经网络基础","category":"AI基础","content":"神经网络模仿人脑的结构，由大量“神经元”互相连接组成。每个神经元做两件事：①接收输入，加权求和（每个输入乘以一个权重，然后相加）；②通过激活函数决定是否“激活”（输出信号）。神经网络的结构：输入层（接收数据）→ 隐藏层（处理数据，可以有很多层）→ 输出层（给出结果）。训练过程就是不断调整权重，让输出更接近正确答案。关键概念：权重（连接强度）、偏置（激活阈值）、激活函数（引入非线性）、学习率（调整权重的步长大小）。神经网络的强大之处在于：只要有足够的数据和层数，它可以逼近任何函数。","keywords":["神经网络","神经元","权重","偏置","激活函数","输入层","隐藏层","输出层"]},"kb_overfitting":{"title":"过拟合与欠拟合","category":"模型训练与评估","content":"过拟合和欠拟合是模型训练中最重要的两个问题。过拟合：模型把训练数据“背”下来了，在训练集上表现很好，但在新数据上表现很差。就像一个学生背了所有真题的答案，但不会举一反三。欠拟合：模型太简单，连训练数据的规律都没学到。就像一个学生连课本都没看懂。解决过拟合：①增加数据量；②正则化（L1/L2）；③Dropout（随机丢弃部分神经元）；④早停（验证集效果不再提升就停止训练）；⑤数据增强。解决欠拟合：①增加模型复杂度（更多层/参数）；②减少正则化强度；③增加训练时间；④特征工程。","keywords":["过拟合","欠拟合","正则化","Dropout","早停","数据增强","泛化能力"]},"kb_cross_validation":{"title":"交叉验证","category":"模型训练与评估","content":"交叉验证是评估模型泛化能力的方法。最常用的是K折交叉验证：把数据分成K份（通常K=5或10），轮流用其中K-1份训练、剩下1份验证，重复K次，最后取平均分。这样每份数据都被用作验证一次，评估结果更可靠。为什么不直接把数据分成训练集和验证集？因为一次分割可能运气不好——刚好验证集特别难或特别简单。交叉验证通过多次评估取平均，减少了这种随机性。其他变体：留一交叉验证（每次留1个样本验证，适合小数据集）、分层交叉验证（保证每折中各类别的比例相同）。","keywords":["交叉验证","K折","泛化能力","验证集","分层交叉验证"]},"kb_loss_function":{"title":"损失函数","category":"模型训练与评估","content":"损失函数衡量模型的预测值和真实值之间的差距。训练模型的目标就是最小化损失函数。常见的损失函数：①均方误差（MSE）——用于回归问题，计算预测值和真实值差的平方的平均值；②交叉熵损失——用于分类问题，衡量两个概率分布的差异；③二元交叉熵——用于二分类（如判断是/否）；④分类交叉熵——用于多分类（如判断是猫/狗/鸟）。损失函数的选择取决于任务类型：回归用MSE，分类用交叉熵。损失函数值越小，模型越好。训练过程就是通过梯度下降不断调整参数，让损失函数值越来越小。","keywords":["损失函数","均方误差","MSE","交叉熵","梯度下降"]},"kb_activation":{"title":"激活函数","category":"模型训练与评估","content":"激活函数是神经网络中引入非线性的关键组件。没有激活函数，不管网络有多少层，都等价于一个线性模型——解决不了复杂问题。常见激活函数：①Sigmoid——输出0到1之间，适合二分类输出层，但有梯度消失问题；②Tanh——输出-1到1之间，比Sigmoid好一点，但也有梯度消失；③ReLU——负数输出0，正数输出原值，计算简单、训练快，是目前最常用的隐藏层激活函数；④Softmax——把输出转为概率分布（所有输出加起来等于1），适合多分类输出层。选择建议：隐藏层用ReLU，二分类输出层用Sigmoid，多分类输出层用Softmax。","keywords":["激活函数","Sigmoid","Tanh","ReLU","Softmax","非线性","梯度消失"]},"kb_gradient_descent":{"title":"梯度下降","category":"模型训练与评估","content":"梯度下降是训练模型的核心算法。想象你蒙着眼站在山上，要走到山谷最低点（损失函数最小值）。方法是：感受脚下的坡度（梯度），往最陡的下坡方向走一步，重复这个过程直到到达谷底。数学上，梯度是函数变化最快的方向，沿梯度的反方向走就能让损失函数下降最快。关键参数——学习率：决定每步走多远。太大会跳过谷底，太小会走得很慢。常见变体：①批量梯度下降——用全部数据计算梯度，准但慢；②随机梯度下降（SGD）——用1个样本算梯度，快但不稳定；③小批量梯度下降——折中方案，用32/64/128个样本，实践中最常用。","keywords":["梯度下降","学习率","SGD","小批量","损失函数","梯度"]},"kb_hyperparameter":{"title":"超参数调优","category":"模型训练与评估","content":"超参数是训练前人为设定的参数，和模型训练中自动学习的参数不同。常见的超参数：学习率（步长大小）、批量大小（每次用多少数据训练）、网络层数、每层神经元数、正则化强度、迭代轮数等。超参数调优方法：①网格搜索——尝试所有组合，穷举但慢；②随机搜索——随机尝试一些组合，比网格搜索效率高；③贝叶斯搜索——根据之前的结果智能选择下一组参数，最高效。实践建议：先用默认参数跑一个基线，然后重点调学习率（最重要）和批量大小，最后调正则化参数。超参数调优是AI工程师的日常工作之一。","keywords":["超参数","学习率","批量大小","网格搜索","随机搜索","贝叶斯搜索"]},"kb_tokenization":{"title":"分词技术","category":"NLP","content":"分词是NLP的第一步，把连续的文本切分成一个个词语或token。中文分词比英文难，因为中文没有空格分隔。“我爱人工智能”→“我/爱/人工智能”还是“我/爱/人工/智能”？分词方法：①基于规则——用词典匹配，如正向最大匹配法；②基于统计——用隐马尔可夫模型（HMM）、条件随机场（CRF）等；③基于深度学习——用BiLSTM+CRF、BERT等。常用工具：jieba（最流行的中文分词库）、HanLP、pkuseg。分词的准确性直接影响后续任务（情感分析、文本分类等）的效果。现代大语言模型（如GPT、BERT）使用子词分词（如BPE），不再依赖传统分词。","keywords":["分词","中文分词","jieba","HMM","CRF","BPE","子词"]},"kb_word_embedding":{"title":"词向量","category":"NLP","content":"词向量是把词语转换成数字向量的技术。计算机不认识文字，只认识数字，所以需要把“国王”变成[0.2, 0.8, -0.1, ...]这样的向量。好的词向量有个神奇特性：语义相近的词，向量也相近。经典例子：国王-男人+女人≈女王。主要方法：①Word2Vec——Google提出的，用CBOW或Skip-gram模型训练；②GloVe——Stanford提出的，基于全局共现统计；③FastText——Facebook提出的，考虑子词信息，能处理未登录词。词向量的维度通常100-300维。词向量是静态的（一个词只有一个向量），后来被ELMo、BERT等动态词向量取代，后者能根据上下文给同一个词不同的向量。","keywords":["词向量","Word2Vec","GloVe","FastText","CBOW","Skip-gram","嵌入"]},"kb_transformer":{"title":"Transformer 架构","category":"NLP","content":"Transformer是2017年Google提出的模型架构，彻底改变了NLP领域。核心创新是“自注意力机制”（Self-Attention）：让模型在处理每个词时，能同时关注句子中所有其他词，判断哪些词最重要。比如“它”指代什么？Transformer能通过注意力权重找到答案。Transformer由编码器和解码器组成：编码器负责理解输入，解码器负责生成输出。关键组件：多头注意力（同时从多个角度关注）、前馈网络、残差连接、层归一化。Transformer的优势：①可以并行处理（比RNN快得多）；②能捕捉长距离依赖。BERT只用编码器，GPT只用解码器，T5编码器解码器都用。","keywords":["Transformer","自注意力","编码器","解码器","多头注意力","BERT","GPT"]},"kb_bert":{"title":"BERT 模型","category":"NLP","content":"BERT是Google在2018年提出的预训练语言模型，全称是Bidirectional Encoder Representations from Transformers。它的创新点是“双向”理解——同时看一个词的左边和右边的上下文。之前的模型（如GPT）只能从左到右看，BERT可以同时看前后文。BERT的预训练任务：①遮盖语言模型（MLM）——随机遮盖一些词，让模型预测被遮盖的词；②下一句预测（NSP）——判断两句话是否相邻。预训练完成后，只需在特定任务上微调就能取得很好效果。BERT在发布时横扫了11个NLP基准测试。中文版有哈工大的BERT-wwm和百度的ERNIE。","keywords":["BERT","预训练","微调","MLM","NSP","双向","Transformer"]},"kb_sentiment":{"title":"情感分析","category":"NLP","content":"情感分析是判断文本表达的情感倾向：正面、负面或中性。应用非常广泛：分析商品评价、监控社交媒体舆情、分析客户反馈等。方法从简单到复杂：①基于词典——数正面词和负面词的个数，简单但准确率低；②传统机器学习——用朴素贝叶斯、SVM等，需要人工特征工程；③深度学习——用LSTM、CNN、BERT等，自动学习特征，效果最好。情感分析的难点：反讽（“太'好'了”其实是负面）、否定句（“不好”）、隐含情感（“等了两小时才上菜”是负面但没有负面词）。细粒度情感分析还能判断对具体方面的情感，如“手机拍照很好但电池不行”。","keywords":["情感分析","文本分类","词典","朴素贝叶斯","LSTM","细粒度"]},"kb_speech_recognition":{"title":"语音识别","category":"NLP","content":"语音识别（ASR）是把语音转换成文字的技术。流程：语音信号→特征提取→声学模型→语言模型→文字。关键概念：①特征提取——把声波转为MFCC等数字特征；②声学模型——学习语音特征和音素的对应关系；③语言模型——利用语言规律提高识别准确率（如“我想吃饭”比“我想吃撑”更可能）。现代方法用端到端深度学习，直接从语音到文字，不需要分步骤。代表模型：DeepSpeech（百度）、Whisper（OpenAI）。语音识别的挑战：口音、噪音、同音字、专业术语。应用：语音助手（Siri、小爱同学）、语音输入、会议记录。","keywords":["语音识别","ASR","MFCC","声学模型","语言模型","Whisper","端到端"]},"kb_image_classification":{"title":"图像分类","category":"计算机视觉","content":"图像分类是最基础的CV任务：给一张图片，判断它属于哪个类别（猫/狗/车/人）。核心技术是卷积神经网络（CNN）。CNN的工作原理：①卷积层——用小的“滤波器”在图片上滑动，提取局部特征（边缘、纹理）；②池化层——缩小特征图尺寸，减少计算量；③全连接层——综合所有特征做出分类决策。经典模型演进：LeNet（1998）→AlexNet（2012）→VGG（2014）→ResNet（2015）→EfficientNet（2019）。ResNet引入“残差连接”解决了深层网络训练困难的问题。图像分类的评估指标：准确率、Top-1准确率、Top-5准确率。","keywords":["图像分类","CNN","卷积","池化","ResNet","AlexNet","VGG"]},"kb_object_detection":{"title":"目标检测","category":"计算机视觉","content":"目标检测不仅要识别图片中有什么，还要找出它在哪里（用边界框标出）。输出是：类别 + 位置（x, y, w, h）。两大流派：①两阶段方法——先生成候选区域，再分类，如R-CNN系列（R-CNN→Fast R-CNN→Faster R-CNN），准确但慢；②一阶段方法——直接预测位置和类别，如YOLO系列、SSD，速度快但精度稍低。YOLO（You Only Look Once）把目标检测当回归问题，一次前向传播就出结果，非常快。评估指标：mAP（平均精度均值），综合考虑精确率和召回率。应用：自动驾驶（检测行人、车辆）、安防监控、工业质检。","keywords":["目标检测","R-CNN","YOLO","SSD","边界框","mAP","候选区域"]},"kb_image_segmentation":{"title":"图像分割","category":"计算机视觉","content":"图像分割是把图片的每个像素都分类，标出每个像素属于什么。比目标检测更精细——不只是画框，而是精确到像素级别。三种类型：①语义分割——每个像素标类别，但不区分同类的不同实例（所有人标成同一颜色）；②实例分割——区分同类的不同实例（每个人标不同颜色），如Mask R-CNN；③全景分割——结合语义分割和实例分割。常用网络：FCN（全卷积网络）、U-Net（医学图像分割的经典）、DeepLab。应用：医学影像（标注肿瘤区域）、自动驾驶（理解道路场景）、人像抠图、卫星图像分析。","keywords":["图像分割","语义分割","实例分割","Mask R-CNN","U-Net","FCN","像素"]},"kb_face_recognition":{"title":"人脸识别","category":"计算机视觉","content":"人脸识别是判断“这是谁”的技术。流程：①人脸检测——在图片中找到人脸位置；②人脸对齐——把人脸旋转到标准角度；③特征提取——把人脸转为特征向量（通常是128维或512维）；④比对——计算两个特征向量的距离，判断是否同一个人。经典方法：FaceNet（Google）、ArcFace。评估指标：在LFW数据集上准确率已达99.8%以上。人脸识别的伦理争议：①隐私问题——未经同意被监控识别；②偏见问题——对不同种族、性别识别率不同；③安全问题——照片/视频欺骗。我国规定，物业不得强制刷脸进门，这是人脸识别应用的重要限制。","keywords":["人脸识别","人脸检测","FaceNet","ArcFace","特征向量","LFW","隐私"]},"kb_etl":{"title":"ETL 数据处理流程","category":"数据处理","content":"ETL是Extract-Transform-Load的缩写，是数据仓库的核心流程。①Extract（抽取）：从各种数据源（数据库、API、文件、日志）提取原始数据；②Transform（转换）：清洗（去重、补缺、纠错）、标准化（统一格式、单位）、聚合（汇总计算）、衍生（计算新字段）；③Load（加载）：把处理好的数据写入目标系统（数据仓库、数据库）。ETL的重要性：垃圾数据进→垃圾模型出，数据质量直接决定AI模型效果。常见ETL工具：Apache NiFi、Talend、Informatica、Kettle。现代数据处理也有ELT模式（先加载再转换），适合大数据场景。","keywords":["ETL","数据抽取","数据转换","数据加载","数据仓库","Apache NiFi"]},"kb_data_cleaning":{"title":"数据清洗","category":"数据处理","content":"数据清洗是把“脏数据”变成“干净数据”的过程。常见的数据问题：①缺失值——某些字段为空（处理：删除、填充均值/中位数/众数、用模型预测）；②异常值——明显不合理的数据（处理：删除、截断、单独分析）；③重复值——同一条数据出现多次（处理：去重）；④格式不一致——如日期有“2024-01-01”和“01/01/2024”两种格式（处理：统一格式）；⑤错误数据——如年龄200岁、收入负数（处理：修正或删除）。数据清洗通常占整个数据分析工作量的60-80%。Python中常用Pandas进行数据清洗：dropna()删除缺失值、fillna()填充缺失值、drop_duplicates()去重。","keywords":["数据清洗","缺失值","异常值","重复值","Pandas","dropna","fillna"]},"kb_data_annotation":{"title":"数据标注","category":"数据处理","content":"数据标注是为原始数据添加标签的过程，是监督学习的基础。标注类型：①图像标注——画框（目标检测）、画多边形（分割）、打标签（分类）；②文本标注——实体标注（NER）、关系标注、情感标注；③语音标注——转写文字、标注说话人；④视频标注——标注动作、追踪目标。标注流程：制定标注规范→培训标注员→试标注→正式标注→质量审核。标注质量直接影响模型效果，所以需要多人标注取交集（一致性检查）。常用标注工具：LabelImg（图像）、Labelme（多边形）、Doccano（文本）、Label Studio（多格式）。标注是AI训练师的核心工作之一。","keywords":["数据标注","标注工具","LabelImg","Labelme","Doccano","标注规范","质量审核"]},"kb_feature_engineering":{"title":"特征工程","category":"数据处理","content":"特征工程是从原始数据中提取有用特征的过程，是传统机器学习中最重要的环节。“数据和特征决定了效果的上限，模型只是逼近这个上限。”特征工程的方法：①数值特征——标准化（Z-score）、归一化（Min-Max）、对数变换、分箱；②类别特征——独热编码（One-Hot）、标签编码（Label Encoding）；③文本特征——TF-IDF、词袋模型、词向量；④时间特征——提取年/月/日/星期/小时、计算时间差；⑤交互特征——特征组合（如面积=长×宽）。深度学习能自动学习特征，所以特征工程在深度学习中没那么重要，但在表格数据上，传统方法+好的特征工程仍然很有竞争力。","keywords":["特征工程","标准化","归一化","独热编码","TF-IDF","特征选择"]},"kb_data_augmentation":{"title":"数据增强","category":"数据处理","content":"数据增强是通过对现有数据做变换来“造”出更多训练数据的方法，主要用于解决数据不足的问题。图像增强：翻转、旋转、裁剪、缩放、调整亮度/对比度、加噪声、颜色抖动、Mixup（混合两张图）、Cutout（遮挡部分区域）。文本增强：同义词替换、随机插入/删除/交换、回译（中→英→中）、文本生成。语音增强：变速、变调、加背景噪声、时间偏移。数据增强的作用：①增加训练数据量；②提高模型的泛化能力；③减少过拟合。注意：增强操作要符合实际场景——比如医学图像不能随便翻转（左右可能有不同含义）。PyTorch中用torchvision.transforms实现图像增强。","keywords":["数据增强","翻转","旋转","Mixup","回译","torchvision","泛化"]},"kb_data_exploration":{"title":"数据探索（EDA）","category":"数据处理","content":"数据探索（Exploratory Data Analysis, EDA）是在建模前先“看看数据长什么样”的过程。EDA的目标：了解数据的基本特征、发现异常、找到规律、指导后续处理。EDA的步骤：①基本统计——均值、中位数、标准差、最大最小值、缺失率；②分布分析——画直方图、箱线图，看数据分布是否偏斜、有没有异常值；③相关性分析——计算特征之间的相关系数，画热力图，发现冗余特征；④类别分析——看各类别的样本数是否均衡；⑤可视化——散点图、折线图、柱状图。Python中常用Pandas（describe()、info()）、Matplotlib、Seaborn进行EDA。EDA是数据科学家的基本功，也是AI训练师在开始标注前应该做的工作。","keywords":["数据探索","EDA","统计","分布","相关性","可视化","Pandas","Seaborn"]},"kb_distributed":{"title":"分布式计算","category":"大数据与数据库","content":"分布式计算是把一个大任务分给多台计算机一起完成。单台计算机处理不了的数据量（如PB级），用分布式就能搞定。核心思想：分而治之。MapReduce是经典框架：Map阶段把任务拆分到各节点，Reduce阶段汇总结果。分布式系统的挑战：①数据一致性——多台机器的数据如何保持同步（CAP定理）；②容错——某台机器挂了怎么办（数据副本）；③网络延迟——机器之间通信有延迟；④负载均衡——不能让某些机器太闲、某些太忙。常见分布式框架：Hadoop（批处理）、Spark（内存计算，比Hadoop快10-100倍）、Flink（流处理）。","keywords":["分布式","MapReduce","Hadoop","Spark","Flink","CAP定理","容错"]},"kb_hadoop_spark":{"title":"Hadoop 与 Spark","category":"大数据与数据库","content":"Hadoop和Spark是大数据处理的两大框架。Hadoop包含三个核心组件：①HDFS——分布式文件系统，把大文件切块存到多台机器上；②MapReduce——分布式计算框架，把计算任务分发到各节点；③YARN——资源管理器，管理集群的CPU和内存。Spark是Hadoop MapReduce的替代品，最大优势是“内存计算”——中间结果存在内存里而不是写磁盘，所以快10-100倍。Spark的核心概念：RDD（弹性分布式数据集）、DataFrame（类似Pandas的表格）、Spark SQL（用SQL查询大数据）、Spark MLlib（机器学习库）。选择建议：需要迭代计算的场景（如机器学习）用Spark，一次性批处理可以用Hadoop。","keywords":["Hadoop","Spark","HDFS","MapReduce","YARN","RDD","DataFrame","内存计算"]},"kb_sql":{"title":"SQL 数据库基础","category":"大数据与数据库","content":"SQL（Structured Query Language）是操作关系型数据库的标准语言。关系型数据库把数据存在“表”中，每行是一条记录，每列是一个字段。核心操作：①SELECT——查询数据（SELECT * FROM users WHERE age>18）；②INSERT——插入数据；③UPDATE——更新数据；④DELETE——删除数据。进阶：JOIN（多表关联）、GROUP BY（分组聚合）、子查询、索引（加速查询）。常见关系型数据库：MySQL（最流行）、PostgreSQL（功能最强）、SQLite（轻量级，嵌入式）、Oracle（企业级）。SQL的ACID特性：原子性（要么全做要么全不做）、一致性（数据始终合法）、隔离性（并发互不干扰）、持久性（提交后永久保存）。","keywords":["SQL","关系型数据库","SELECT","JOIN","索引","MySQL","PostgreSQL","ACID"]},"kb_cloud":{"title":"云计算基础","category":"大数据与数据库","content":"云计算是通过互联网按需提供计算资源。三种服务模式：①IaaS（基础设施即服务）——提供虚拟机、存储、网络，用户自己装软件，如AWS EC2、阿里云ECS；②PaaS（平台即服务）——提供开发平台和运行环境，用户只管写代码，如Google App Engine；③SaaS（软件即服务）——提供完整的软件，用户直接用，如Office 365、钉钉。云计算的优势：①弹性伸缩——用多少付多少，高峰期自动扩容；②无需自建机房——省钱省力；③高可用——数据多副本，不怕硬件故障。三大云厂商：AWS（全球第一）、Azure（微软）、阿里云（中国第一）。AI训练师用云计算主要是为了GPU算力。","keywords":["云计算","IaaS","PaaS","SaaS","AWS","阿里云","弹性伸缩"]},"kb_python":{"title":"Python 编程基础","category":"Python编程","content":"Python是AI和数据科学领域最流行的编程语言，因为语法简洁、生态丰富。Python的特点：①解释型语言——不需要编译，直接运行；②动态类型——变量不需要声明类型；③缩进语法——用缩进表示代码块（不是花括号）；④丰富的库——NumPy（数值计算）、Pandas（数据分析）、Matplotlib（可视化）、Scikit-learn（机器学习）、PyTorch/TensorFlow（深度学习）。Python的数据类型：整数int、浮点数float、字符串str、布尔bool、列表list、字典dict、元组tuple、集合set。控制流：if-elif-else、for/while循环。AI训练师需要掌握Python基础，能读写数据处理脚本。","keywords":["Python","NumPy","Pandas","Matplotlib","Scikit-learn","PyTorch","TensorFlow"]},"kb_numpy_pandas":{"title":"NumPy 与 Pandas","category":"Python编程","content":"NumPy和Pandas是Python数据处理的两大基石。NumPy提供高效的多维数组操作：①ndarray——N维数组对象，比Python列表快100倍；②向量化运算——不用写循环就能对整个数组做运算；③广播——不同形状的数组也能运算。常用函数：array()、zeros()、ones()、arange()、reshape()、dot()。Pandas提供表格数据处理：①Series——一维数据（类似Excel一列）；②DataFrame——二维表格（类似Excel一张表）；③强大的数据操作——读写CSV/Excel/SQL、筛选、分组、合并、透视表。常用函数：read_csv()、head()、describe()、groupby()、merge()、pivot_table()。Pandas是数据分析师的Excel替代品，功能强大100倍。","keywords":["NumPy","Pandas","ndarray","DataFrame","Series","向量化","groupby"]},"kb_data_structures":{"title":"数据结构基础","category":"Python编程","content":"数据结构是组织和存储数据的方式。常见数据结构：①数组/列表——连续存储，按下标访问O(1)，插入删除O(n)；②链表——非连续存储，插入删除O(1)，访问O(n)；③栈——后进先出（LIFO），像叠盘子；④队列——先进先出（FIFO），像排队；⑤哈希表/字典——键值对存储，查找O(1)，Python的dict就是哈希表；⑥树——层次结构，二叉搜索树查找O(log n)；⑦图——节点和边的关系网络。时间复杂度衡量算法快慢：O(1)常数>O(log n)对数>O(n)线性>O(n²)平方。Python内置数据结构：list（动态数组）、dict（哈希表）、set（集合）、deque（双端队列）。","keywords":["数据结构","数组","链表","栈","队列","哈希表","树","图","时间复杂度"]},"kb_algorithms":{"title":"算法基础","category":"Python编程","content":"算法是解决问题的步骤和方法。常见算法类型：①排序算法——冒泡排序O(n²)、快速排序O(n log n)、归并排序O(n log n)；②查找算法——顺序查找O(n)、二分查找O(log n)；③递归——函数调用自身，如阶乘、斐波那契数列；④贪心算法——每步选当前最优，如找零钱问题；⑤动态规划——把大问题拆成小问题，避免重复计算，如背包问题、最长公共子序列；⑥图算法——BFS（广度优先搜索）、DFS（深度优先搜索）、最短路径（Dijkstra）。算法评估：时间复杂度（运行多久）和空间复杂度（用多少内存）。AI面试常考算法题，LeetCode是练习的好地方。","keywords":["算法","排序","二分查找","递归","贪心","动态规划","BFS","DFS","时间复杂度"]},"kb_excel":{"title":"Excel 核心功能","category":"办公与计算机基础","content":"Excel是最常用的电子表格软件。核心功能：①公式与函数——SUM（求和）、AVERAGE（平均值）、COUNT（计数）、IF（条件判断）、VLOOKUP（查找匹配）、SUMIFS（条件求和）；②数据透视表——快速汇总大量数据，按维度分组统计，是Excel最强大的功能；③条件格式——根据条件自动变色，如数据条、色阶、图标集；④图表——柱状图、折线图、饼图、散点图；⑤数据验证——限制输入范围，如下拉列表；⑥排序与筛选——按列排序、自动筛选。Excel快捷键：Ctrl+C/V（复制粘贴）、Ctrl+Z（撤销）、Ctrl+Home/End（跳到首尾）。AI训练师日常工作中，Excel常用于查看和初步分析标注数据。","keywords":["Excel","公式","函数","数据透视表","VLOOKUP","条件格式","图表"]},"kb_word":{"title":"Word 文档处理","category":"办公与计算机基础","content":"Word是文字处理软件，用于撰写报告、文档、论文等。核心功能：①样式——标题1/2/3、正文，统一格式且自动生成目录；②图文混排——插入图片、表格、图表，设置环绕方式；③页眉页脚——添加页码、文档标题；④目录——基于标题样式自动生成，可更新；⑤批注与修订——多人协作时添加评论和修改痕迹；⑥邮件合并——批量生成个性化文档（如证书、信封）。Word的正确用法：用样式而不是手动设置字号和加粗，这样修改起来方便且能自动生成目录。导出格式：.docx（默认）、.pdf（分享用）、.html（网页用）。","keywords":["Word","样式","目录","页眉页脚","批注","修订","邮件合并"]},"kb_windows":{"title":"Windows 操作系统基础","category":"办公与计算机基础","content":"Windows是最常用的操作系统。核心概念：①文件管理——文件夹结构、文件路径、文件属性（只读/隐藏/系统）；②系统设置——网络配置、显示设置、电源管理、用户账户；③任务管理器——Ctrl+Shift+Esc打开，查看CPU/内存使用率、结束无响应程序；④快捷键——Win+E（打开文件管理器）、Win+D（显示桌面）、Alt+Tab（切换窗口）、Ctrl+Alt+Delete（安全选项）；⑤命令提示符——cmd或PowerShell，执行文本命令；⑥控制面板/设置——安装卸载程序、防火墙设置、系统更新。Windows的文件系统是NTFS，支持权限管理。常见问题：C盘空间不足（清理临时文件、移动用户文件夹到D盘）。","keywords":["Windows","文件管理","任务管理器","快捷键","命令提示符","NTFS"]},"kb_browser":{"title":"浏览器使用","category":"办公与计算机基础","content":"浏览器是访问互联网的工具。主流浏览器：Chrome（市场份额最大）、Edge（微软新浏览器，基于Chromium）、Firefox（开源）、Safari（苹果专用）。核心功能：①标签页管理——Ctrl+T新建、Ctrl+W关闭、Ctrl+Shift+T恢复关闭的标签；②书签——收藏常用网站，Ctrl+D添加书签；③开发者工具——F12打开，查看网页源代码、网络请求、控制台；④隐私设置——清除浏览数据、无痕模式、Cookie管理；⑤扩展程序——安装插件增强功能（如广告拦截、翻译）。浏览器的内核：Chrome/Edge用Blink，Firefox用Gecko，Safari用WebKit。浏览器也是AI训练师的工具——用它访问在线标注平台、查阅文档、测试Web应用。","keywords":["浏览器","Chrome","书签","开发者工具","Cookie","扩展程序","内核"]},"kb_encryption":{"title":"数据加密","category":"数据安全与隐私","content":"数据加密是把明文变成密文的过程，只有持有密钥的人才能解密。两种加密方式：①对称加密——加密和解密用同一个密钥，速度快但密钥分发困难，常见算法：AES、DES；②非对称加密——用公钥加密、私钥解密（或反过来），安全但速度慢，常见算法：RSA、ECC。实际应用中常混合使用：用非对称加密传递对称密钥，再用对称密钥加密数据。HTTPS就是这么做的。哈希（散列）不是加密：哈希是单向的，不能解密，用于验证数据完整性（如MD5、SHA-256）。密码存储应该用哈希+盐（salt），不能存明文密码。数据加密是数据安全的基础技术。","keywords":["加密","对称加密","非对称加密","AES","RSA","哈希","HTTPS","MD5"]},"kb_access_control":{"title":"访问控制","category":"数据安全与隐私","content":"访问控制是决定“谁能访问什么”的机制。三种方式：①自主访问控制（DAC）——资源所有者决定谁能访问，如文件权限设置；②强制访问控制（MAC）——系统根据安全级别强制执行，如军事系统；③基于角色的访问控制（RBAC）——根据角色分配权限，如管理员/编辑/访客，是最常用的方式。认证方式（证明你是谁）：密码、短信验证码、指纹/人脸、数字证书、OAuth（用第三方账号登录）。授权方式（你能做什么）：ACL（访问控制列表）、JWT（JSON Web Token）、Session。最小权限原则：只给用户完成工作所需的最少权限。AI训练师在标注平台上通常只有标注权限，没有管理权限。","keywords":["访问控制","RBAC","DAC","认证","授权","OAuth","JWT","最小权限"]},"kb_privacy_protection":{"title":"数据隐私保护","category":"数据安全与隐私","content":"数据隐私保护是保护个人信息不被滥用的技术和管理措施。技术手段：①数据脱敏——把敏感信息替换为假数据，如把身份证号中间几位换成*；②差分隐私——在数据中加入精心设计的噪声，保护个体隐私同时保留统计特征；③联邦学习——数据不出本地，只共享模型参数，实现“数据可用不可见”；④同态加密——在密文上直接计算，解密后得到正确结果；⑤k-匿名——确保每条记录至少有k-1条其他记录与之不可区分。管理措施：数据分类分级、隐私影响评估、数据处理协议、安全审计。GDPR（欧盟）和《个人信息保护法》（中国）是最严格的隐私保护法规。","keywords":["隐私保护","数据脱敏","差分隐私","联邦学习","同态加密","k-匿名","GDPR"]},"kb_backup":{"title":"数据备份与恢复","category":"数据安全与隐私","content":"数据备份是防止数据丢失的最重要措施。备份策略：①全量备份——复制所有数据，恢复快但占空间大；②增量备份——只备份上次备份后变化的数据，节省空间但恢复慢；③差异备份——备份上次全量备份后变化的数据，折中方案。备份原则“3-2-1”：3份数据、2种介质、1份异地。比如：本地硬盘1份+NAS 1份+云存储1份。备份存储介质：硬盘、磁带（大容量长期存储）、云存储。恢复演练：定期测试备份是否能成功恢复，不然备份可能无效。数据存储工具通常具有自动备份功能，如数据库的主从复制、RAID磁盘阵列（通过冗余防止单点故障）。","keywords":["数据备份","全量备份","增量备份","差异备份","3-2-1原则","RAID","恢复"]},"kb_hci":{"title":"人机交互设计原则","category":"人机交互","content":"人机交互（HCI）研究人和计算机之间的交互方式。核心设计原则：①一致性——相同功能在不同地方外观和操作一致；②反馈——用户的每个操作都要有响应（如按钮点击变色、加载进度条）；③容错——允许用户犯错并提供撤销功能；④简洁——减少不必要的元素，突出核心功能；⑤可访问性——考虑色盲、视障等特殊用户的需求。交互方式演进：命令行→图形界面（GUI）→触摸屏→语音交互→手势交互→脑机接口。尼尔森十大可用性原则是HCI领域的金标准。AI训练师在设计标注界面时，需要遵循HCI原则，让标注员操作高效、不易出错。","keywords":["人机交互","HCI","一致性","反馈","容错","可用性","尼尔森十大原则"]},"kb_ui_design":{"title":"界面设计基础","category":"人机交互","content":"界面设计（UI Design）关注产品的视觉呈现。核心要素：①布局——信息层次清晰，重要内容放在显眼位置（F型/Z型阅读模式）；②色彩——主色+辅助色+强调色，注意对比度和色彩心理学；③字体——选择易读字体，控制字号层级（标题>副标题>正文>注释）；④图标——表意清晰，风格统一；⑤间距——留白让界面呼吸，不要挤在一起。设计工具：Figma（最流行）、Sketch（Mac专用）、Adobe XD。设计规范：Material Design（Google）、Human Interface Guidelines（Apple）。响应式设计：同一套界面适配不同屏幕尺寸（手机/平板/电脑）。","keywords":["界面设计","UI","布局","色彩","字体","Figma","Material Design","响应式"]},"kb_feedback":{"title":"交互反馈机制","category":"人机交互","content":"反馈是告诉用户“系统收到了你的操作”的机制。没有反馈，用户会困惑“点了吗？成功了吗？”。反馈类型：①视觉反馈——按钮变色、加载动画、进度条、成功/错误提示；②听觉反馈——提示音、错误警告音；③触觉反馈——手机震动、按键触感；④状态反馈——loading状态、空状态提示、网络错误提示。反馈设计原则：①即时——操作后立即反馈，延迟不超过0.1秒；②明确——告诉用户发生了什么（成功/失败/进行中）；③可操作——错误反馈要告诉用户怎么解决；④适度——不要过度打扰（如频繁弹窗）。Toast提示（自动消失的小提示）是最常用的轻量级反馈方式。","keywords":["反馈","视觉反馈","Toast","加载动画","进度条","错误提示","用户体验"]},"kb_smart_cs":{"title":"智能客服系统","category":"AI应用","content":"智能客服是AI最成熟的应用之一。核心技术：①意图识别——判断用户想干什么（查物流/退换货/投诉）；②实体抽取——提取关键信息（订单号、商品名）；③对话管理——维护对话状态，决定下一步回复什么；④知识库检索——从FAQ库中找到最匹配的答案。实现方式：规则匹配（简单场景）→ 机器学习分类 → 深度学习端到端 → 大语言模型（ChatGPT）。评估指标：意图识别准确率、解决率（不需要转人工的比例）、用户满意度。智能客服的局限：复杂问题、情感安抚、需要灵活应变的场景仍然需要人工客服。AI训练师的工作之一就是维护和优化智能客服的知识库和训练数据。","keywords":["智能客服","意图识别","实体抽取","对话管理","知识库","ChatGPT"]},"kb_autonomous_driving":{"title":"自动驾驶","category":"AI应用","content":"自动驾驶是AI在交通领域的应用。分级（SAE标准）：L0（无自动化）→L1（辅助驾驶，如自适应巡航）→L2（部分自动化，如特斯拉Autopilot）→L3（有条件自动化，特定场景可以放手）→L4（高度自动化，限定区域无人驾驶）→L5（完全自动化，任何场景都能开）。核心技术：①感知——用摄像头、激光雷达（LiDAR）、毫米波雷达感知环境；②定位——GPS+高精地图+IMU确定位置；③决策——路径规划、行为预测；④控制——油门/刹车/转向执行。感知是AI训练师最相关的领域：需要大量标注数据（标注行人、车辆、交通标志等）来训练感知模型。","keywords":["自动驾驶","L1-L5","感知","激光雷达","摄像头","路径规划","标注"]},"kb_knowledge_graph":{"title":"知识图谱","category":"AI应用","content":"知识图谱是用图结构表示知识的方式。节点是实体（如“北京”、“中国”），边是关系（如“首都_of”）。知识图谱把零散的信息组织成一张“知识网络”，让AI能够“理解”事物之间的关系。典型应用：①搜索引擎——Google搜索“李白的妻子”，直接展示答案（而不是一堆链接）；②智能问答——理解复杂问题并从知识库中推理出答案；③推荐系统——发现用户兴趣和商品之间的隐含关系。构建流程：实体识别→关系抽取→知识融合→知识推理。著名知识图谱：Wikidata（维基百科的结构化版本）、DBpedia、YAGO。知识图谱和大语言模型的结合（KG+LLM）是当前的研究热点。","keywords":["知识图谱","实体","关系","知识推理","Wikidata","搜索引擎","KG"]},"kb_generative_ai":{"title":"生成式AI","category":"AI应用","content":"生成式AI是可以创造新内容的AI系统。主要类型：①文本生成——GPT系列、Claude、文心一言，能写文章、对话、代码；②图像生成——DALL-E、Midjourney、Stable Diffusion，根据文字描述生成图片；③音频生成——语音合成（TTS）、音乐生成；④视频生成——Sora（OpenAI）、Runway；⑤代码生成——GitHub Copilot、Cursor。核心技术：Transformer（文本）、扩散模型（图像/视频）、GAN（生成对抗网络）。大语言模型（LLM）通过大规模预训练学习语言模式，再通过RLHF（人类反馈强化学习）对齐人类偏好。生成式AI的风险：幻觉（生成虚假信息）、版权争议、深度伪造。","keywords":["生成式AI","GPT","DALL-E","Midjourney","Sora","扩散模型","RLHF","幻觉"]}};
const D=({"bj":[["道德评价的关键是看其行为是否符合社会道德规范。",true,"✅ 正确。道德评价是依据一定社会或阶级的道德标准对他人和自己的行为进行善恶、荣辱、正当与不正当等价值判断的活动。关键看行为是否符合社会道德规范。"],["人工智能训练师在处理敏感数据时，可以不经用户同意直接使用这些数据进行模型训练。",false,"❌ 错误。人工智能训练师在处理敏感数据时，可以不经用户同意直接使用这些数据进行模型训练，这一说法不正确。正确表述：人工智能训练师在处理敏感数据时，可以不经用户同意直接使用这些数据进行模型训练。"],["随着全球化的发展，职业道德也呈现出单一化的趋势，不同国家和地区的职业道德规范不存在差异。",false,"❌ 错误。随着全球化的发展，职业道德也呈现出单一化的趋势，不同国家和地区的职业道德规范不存在差异，这一说法不正确。正确表述：随着全球化的发展，职业道德也呈现出单一化的趋势，不同国家和地区的职业道德规范不存在差异。 [🔗 职业道德概述]"],["人工智能训练师在职业道德建设中，无需考虑数据的质量与适用性，只需关注模型的训练效果。",false,"❌ 错误。人工智能训练师在职业道德建设中，无需考虑数据的质量与适用性，只需关注模型的训练效果，这一说法不正确。 [🔗 职业道德概述]"],["人工智能训练师在开发和训练AI模型时，不需要对模型可能产生的歧视性或偏见性结果负责。",false,"❌ 错误。人工智能训练师在开发和训练AI模型时，不需要对模型可能产生的歧视性或偏见性结果负责，这一说法不正确。正确表述：人工智能训练师在开发和训练AI模型时，需要对模型可能产生的歧视性或偏见性结果负责。"],["人工智能训练师的职业道德不包括对用户隐私的保护。",false,"❌ 错误。人工智能训练师的职业道德不包括对用户隐私的保护，这一说法不正确。正确表述：人工智能训练师的职业道德不包括对用户隐私的保护。 [🔗 职业道德概述]"],["人工智能训练师的主要任务是设计和开发新的算法。",false,"❌ 错误。人工智能训练师的主要任务是设计和开发新的算法，这一说法不正确。"],["职业守则仅仅是一种软约束，不具备法律效力。",false,"❌ 错误。职业守则是从业人员在职业活动中应遵循的行为准则。特点：行业统一规范（非个人化）、具有约束力、随行业发展更新。核心内容包括道德准则、法律法规、技术规程。因此，正确表述应为：职业守则仅仅是一种软约束，不具备法律效力。"],["职业守则的特点之一是具有普遍性，适用于所有行业。",false,"❌ 错误。职业守则是从业人员在职业活动中应遵循的行为准则。特点：行业统一规范（非个人化）、具有约束力、随行业发展更新。核心内容包括道德准则、法律法规、技术规程。"],["职业守则核心内容不包括遵守法律。",false,"❌ 错误。职业守则是从业人员在职业活动中应遵循的行为准则。特点：行业统一规范（非个人化）、具有约束力、随行业发展更新。核心内容包括道德准则、法律法规、技术规程。因此，正确表述应为：职业守则核心内容包括遵守法律。"],["人工智能训练师在制定职业守则的过程中，应该充分考虑到人工智能技术的发展趋势和潜在风险。",true,"✅ 正确。职业守则是从业人员在职业活动中应遵循的行为准则。特点：行业统一规范（非个人化）、具有约束力、随行业发展更新。核心内容包括道德准则、法律法规、技术规程。"],["职业守则的实施与监督应该完全依靠员工个人的自觉性。",false,"❌ 错误。职业守则是从业人员在职业活动中应遵循的行为准则。特点：行业统一规范（非个人化）、具有约束力、随行业发展更新。核心内容包括道德准则、法律法规、技术规程。"],["职业守则中的奉献社会是指从业人员在工作中要正确处理个人利益和社会整体利益的关系，把个人利益放在首位。",false,"❌ 错误。职业守则是从业人员在职业活动中应遵循的行为准则。特点：行业统一规范（非个人化）、具有约束力、随行业发展更新。核心内容包括道德准则、法律法规、技术规程。 [🔗 职业道德概述]"],["从业人员能否做到爱岗敬业，取决于他是否具有过硬的专业技能。",false,"❌ 错误。爱岗敬业是职业道德的基础。要求：树立正确职业理想、强化职业责任、提高职业技能。表现为认真负责、精益求精、积极主动。"],["人工智能训练师在训练过程中，可以根据自己的经验和直觉来调整模型参数，以提高模型性能。",false,"❌ 错误。人工智能训练师在训练过程中，可以根据自己的经验和直觉来调整模型参数，以提高模型性能，这一说法不正确。"],["语音输入是Windows输入法的一种智能应用。",true,"✅ 正确。Windows语音输入按Win+H启动，支持中英文语音识别转文字。基于微软语音识别引擎，可在大多数文本输入框中使用。 [🔗 Windows 系统操作]"],["Windows系统的维护利器是一款可以帮助用户优化系统性能、清理垃圾文件和修复系统问题的软件。",true,"✅ 正确。Windows系统的维护利器是一款可以帮助用户优化系统性能、清理垃圾文件和修复系统问题的软件，这一说法正确。 [🔗 Windows 系统操作]"],["如果鼠标和键盘都无法使用，可以通过按F8键进入Windows的高级启动选项进行修复。",true,"✅ 正确。如果鼠标和键盘都无法使用，可以通过按F8键进入Windows的高级启动选项进行修复，这一说法正确。 [🔗 Windows 系统操作]"],["Windows 10中小工具中的时钟可以锁定前端显示。",true,"✅ 正确。Windows桌面小工具（Widgets）提供天气、日历、新闻等信息。注意：不要拖放到不适当位置，保持软件版本更新以修复安全漏洞。 [🔗 Windows 系统操作]"],["在浏览器中，可以通过点击地址栏输入网址来访问网页。",true,"✅ 正确。浏览器是访问互联网的工具。主流：Chrome、Edge、Firefox。核心功能：标签页管理、书签、开发者工具（F12）、隐私设置、扩展程序。搜索引擎通过关键词查找网页。"],["浏览器的高级探索功能可以帮助用户更好地了解和管理浏览器的设置和功能。",true,"✅ 正确。浏览器是访问互联网的工具。主流：Chrome、Edge、Firefox。核心功能：标签页管理、书签、开发者工具（F12）、隐私设置、扩展程序。搜索引擎通过关键词查找网页。"],["使用Ctrl + C可以复制选中的文本或对象。",true,"✅ 正确。使用Ctrl + C可以复制选中的文本或对象，这一说法正确。"],["使用Word进行高效办公时，可以同时打开多个文档进行编辑。",true,"✅ 正确。Word核心功能：样式（统一格式）、图文混排、目录自动生成、批注与修订（多人协作）。提高效率的方法：使用快捷键、模板、格式刷、宏自动化。 [🔗 Word 文档处理]"],["Word样式库中的样式可以快速应用到文档中的多个段落或文本框中。",true,"✅ 正确。Word样式库预定义了标题、正文、引用等格式集合。快速应用：选中文本→点击样式。可自定义样式、导入外部样式库、用格式刷复制格式。 [🔗 Word 文档处理]"],["在Word中进行图文混排时，图片和文本框的位置是可以随意调整的。",true,"✅ 正确。Word核心功能：样式（统一格式）、图文混排、目录自动生成、批注与修订（多人协作）。提高效率的方法：使用快捷键、模板、格式刷、宏自动化。 [🔗 Word 文档处理]"],["在Excel中，可以使用公式计算单元格中的数据。",true,"✅ 正确。Excel核心功能：公式计算、数据排序筛选、数据透视表、图表可视化。常用函数：SUM、AVERAGE、VLOOKUP、IF、COUNTIF。宏可自动化重复操作。 [🔗 Excel 核心功能]"],["在Excel中，使用MAX函数可以找到一列数据中的最大值。",true,"✅ 正确。Excel核心功能：公式计算、数据排序筛选、数据透视表、图表可视化。常用函数：SUM、AVERAGE、VLOOKUP、IF、COUNTIF。宏可自动化重复操作。 [🔗 Excel 核心功能]"],["Excel图表的数据可视化功能只能用于静态展示数据，无法进行动态交互。",false,"❌ 错误。数据可视化将数据转为图表，直观展示特征和规律。图表类型：柱状图（对比）、折线图（趋势）、饼图（占比）、散点图（相关性）、热力图（密度）。 [🔗 Excel 核心功能]"],["工作簿的扩展名是.xls。",false,"❌ 错误。工作簿的扩展名是.xls，这一说法不正确。"],["通过利用Excel宏，我们可以将繁琐的重复性任务自动化，使我们的工作变得高效和轻松。",true,"✅ 正确。Excel核心功能：公式计算、数据排序筛选、数据透视表、图表可视化。常用函数：SUM、AVERAGE、VLOOKUP、IF、COUNTIF。宏可自动化重复操作。 [🔗 Excel 核心功能]"],["用人单位与劳动者订立的劳动合同中，约定了试用期满后自动转正的条款，这样的约定是合法的。",true,"✅ 正确。劳动合同是劳动者与用人单位确立劳动关系的协议。必备条款：合同期限、工作内容、劳动报酬、社会保险、劳动保护。试用期包含在合同期限内。 [🔗 劳动合同法基础]"],["劳动合同中必须包含劳动合同期限。",true,"✅ 正确。劳动合同是劳动者与用人单位确立劳动关系的协议。必备条款：合同期限、工作内容 。生成对抗网络中的生成器和判别器是同步训练的，这一说法不正确。"],["人工智能训练师使用Python或R进行智能训练数据处理时，主要依赖于这些编程语言提供的数据处理和机器学习库，以及其支持的数据可视化和预处理方法。",true,"✅ 正确。数据可视化将数据转为图表，直观展示特征和规律。图表类型：柱状图（对比）、折线图（趋势）、饼图（占比）、散点图（相关性）、热力图（密度）。 [🔗 Python 编程基础]"],["模型部署工具的原理是将训练好的模型转换为可执行程序，以便在实际应用中使用。",true,"✅ 正确。模型部署工具的原理是将训练好的模型转换为可执行程序，以便在实际应用中使用，这一说法正确。"],["数据探索分析是指对数据进行收集、整理、清洗和转换的过程。",false,"❌ 错误。数据探索分析是指对数据进行收集、整理、清洗和转换的过程，这一说法不正确。"],["数据探索分析旨在通过初步的图表、图形和统计方法来了解和发现数据的基本特征和结构。",true,"✅ 正确。数据探索分析旨在通过初步的图表、图形和统计方法来了解和发现数据的基本特征和结构，这一说法正确。"],["缺失值处理方法中的删除法是指直接删除含有缺失值的记录。",true,"✅ 正确。缺失值处理：删除（简单但丢信息）、填充（均值/中位数/众数/前向填充/插值/模型预测）。大规模数据集用局部插补或多重插补减少信息损失。"],["当数据集中存在缺失值时，我们应该直接删除这些数据点。",false,"❌ 错误。缺失值处理：删除（简单但丢信息）、填充（均值/中位数/众数/前向填充/插值/模型预测）。大规模数据集用局部插补或多重插补减少信息损失。"],["在Python中，使用箱型图法检测异常值时，任何位于箱型图外的点都应被视为异常值并从数据集中删除。",false,"❌ 错误。异常值检测方法：Z-score（统计）、IQR（四分位距）、孤立森林（机器学习）。处理：删除、替换（均值/中位数）、截断、基于领域知识修正。 [🔗 Python 编程基础]"],["异常值检测的原理完全基于统计学方法，与数据的业务逻辑无关。",false,"❌ 错误。异常值检测方法：Z-score（统计）、IQR（四分位距）、孤立森林（机器学习）。处理：删除、替换（均值/中位数）、截断、基于领域知识修正。"],["噪声数据处理技术只能用于消除图像中的噪声。",false,"❌ 错误。噪声数据处理技术只能用于消除图像中的噪声，这一说法不正确。"],["数据去重技术主要是通过哈希表来实现的。",false,"❌ 错误。数据去重影响因素：数据格式（需统一后比较）、数据规模（影响性能）、更新频率（增量去重）。方法：精确匹配、模糊匹配（编辑距离/相似度）。"],["数据归一化处理的目的是为了改变数据的类型，使其能够适配不同的机器学习算法。",false,"❌ 错误。机器学习让计算机从数据中学习规律。类型：监督学习（有标签）、无监督学习（无标签）、强化学习（奖励反馈）。流程：数据收集→特征工程→模型训练→评估→部署。因此，正确表述应为：数据归一化处理的目的是为了改变数据的类型，使其能够适配不同的机器学习算法。 [🔗 机器学习基础]"],["数据白化处理通常是指一种特殊的归一化技术，它不仅缩放数据使其具有单位方差，还使数据特征之间相互独立，数据白化处理常用于图像处理、语音信号处理和机器学习领域。",true,"✅ 正确。数据白化（Whitening）是对数据进行去相关和标准化处理，使特征之间相关性为0、方差相等。方法：PCA白化、ZCA白化。用于加速训练收敛。 [🔗 特征工程]"],["特征工程是指从原始数据中提取、转换和构建有助于提高模型性能的特征的过程。",true,"✅ 正确。特征工程从原始数据中提取有效特征。方法：特征选择（过滤/包裹/嵌入）、特征提取（PCA/LDA）、特征变换（归一化/标准化）。好特征决定模型上限。 [🔗 特征工程]"],["在选择数据标注工具时，应该首先考虑工具的价格，而不是它支持的标注类型或与现有工作流的集成性。",false,"❌ 错误。数据标注为原始数据添加标签，是监督学习的基础。流程：制定规范→培训标注员→试标注→正式标注→质量审核。标注质量直接影响模型效果。因此，正确表述应为：在选择数据标注工具时，应该首先考虑工具的价格，而是它支持的标注类型或与现有工作流的集成性。 [🔗 数据标注]"],["数据标注技术主要依赖于人工进行标注，因此成本较高。",false,"❌ 错误。数据标注为原始数据添加标签，是监督学习的基础。流程：制定规范→培训标注员→试标注→正式标注→质量审核。标注质量直接影响模型效果。 [🔗 数据标注]"],["在机器学习项目中，训练集、验证集和测试集的 // Parse data into structured format
function parseData(){
  const bank={j:[],s:[],m:[]},exam={j:[],s:[],m:[]};
  D.bj.forEach((q,i)=>bank.j.push({id:i+1,q:q[0],a:q[1],type:'j',explain:q[2]||''}));
  D.bs.forEach((q,i)=>bank.s.push({id:i+1,q:q[0],opts:q[1],a:q[2],type:'s',explain:q[3]||''}));
  D.bm.forEach((q,i)=>bank.m.push({id:i+1,q:q[0],opts:q[1],a:q[2],type:'m',explain:q[3]||''}));
  D.ej.forEach((q,i)=>exam.j.push({id:i+1,q:q[0],a:q[1],type:'j',explain:q[2]||''}));
  D.es.forEach((q,i)=>exam.s.push({id:i+1,q:q[0],opts:q[1],a:q[2],type:'s',explain:q[3]||''}));
  D.em.forEach((q,i)=>exam.m.push({id:i+1,q:q[0],opts:q[1],a:q[2],type:'m',explain:q[3]||''}));
  return{bank,exam};
}

function renderExplain(q){
  const exp=q&&q.explain;
  if(!exp)return'';
  const linked=exp.replace(/\[🔗 (.+?)\]/g,(m,title)=>{
    const entry=Object.entries(KB).find(([k,v])=>v.title===title);
    if(entry){return`<a href="javascript:void(0)" onclick="showKBModal('${entry[0]}')" style="color:#3B82F6;text-decoration:underline;cursor:pointer">🔗 ${title}</a>`;}
    return m;
  });
  return`<div class="explain-box"><div class="explain-title">📖 解析</div><div>${linked}</div></div>`;
}

}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function generateExam(seed){
  // 40 judge, 140 single, 10 multi
  const rng=seed?(s=>()=>{s=(s*9301+49297)%233280;return s/233280})(seed):Math.random;
  const sj=shuffle(bank.j).slice(0,40);
  const ss=shuffle(bank.s).slice(0,140);
  const sm=shuffle(bank.m).slice(0,10);
  return[...sj,...ss,...sm];
}

function calcScore(questions,answers){
  let score=0,correct=0,wrong=0;
  questions.forEach((q,i)=>{
    const ua=answers[i];
    if(!ua&&ua!==false)return;
    const isJ=q.type==='j';
    const isM=q.type==='m';
    let isCorrect=false;
    if(isJ){isCorrect=ua===q.a;if(isCorrect)score+=0.5;}
    else if(isM){
      const uaSorted=[...(ua||[])].sort().join(',');
      const aSorted=[...(q.a||[])].sort().join(',');
      isCorrect=uaSorted===aSorted;
      if(isCorrect)score+=1;
    }else{
      isCorrect=ua===q.a;
      if(isCorrect)score+=0.5;
    }
    if(isCorrect)correct++;else wrong++;
  });
  return{score,correct,wrong,total:questions.length};
}

function addWrong(q,userAns,qType,qIdx){
  const key=qType+'_'+qIdx;
  const existing=state.wrongList.find(w=>w.key===key);
  if(existing){
    existing.userAns=userAns;
    existing.count=Math.max(1,Number(existing.count)||1)+1;
    existing.reviewWrongCount=Math.max(0,Number(existing.reviewWrongCount)||0)+1;
    existing.correctStreak=0;
    existing.lastReviewResult='wrong';
    existing.lastReviewTs=Date.now();
  }else{
    state.wrongList.push(normalizeWrongItem({
      key,
      type:q.type,
      q:q.q,
      opts:q.opts,
      a:q.a,
      explain:q.explain||'',
      userAns,
      count:1,
      correctStreak:0,
      reviewCorrectCount:0,
      reviewWrongCount:1,
      ts:Date.now(),
      lastReviewTs:Date.now(),
      lastReviewResult:'wrong'
    }));
  }
  persistWrongList();
}

function removeWrong(key){
  const item=state.wrongList.find(w=>w.key===key);
  if(!item)return false;
  item.reviewCorrectCount=Math.max(0,Number(item.reviewCorrectCount)||0)+1;
  item.correctStreak=Math.max(0,Number(item.correctStreak)||0)+1;
  item.lastReviewResult='correct';
  item.lastReviewTs=Date.now();
  const target=getWrongRemoveTarget();
  if(target>0&&item.correctStreak>=target){
    state.wrongList=state.wrongList.filter(w=>w.key!==key);
    state.wrongPracticeList=state.wrongPracticeList.filter(k=>k!==key);
    delete state.wrongAnswered[key];
    if(window._wrongMultiTemp)delete window._wrongMultiTemp[key];
    if(state.wrongIdx>=state.wrongPracticeList.length&&state.wrongIdx>0)state.wrongIdx--;
    persistWrongList();
    return true;
  }
  persistWrongList();
  return false;
}

function renderQuestion(q,idx,typeKey,answers){
  const aKey=typeKey+'_'+idx;
  const answered=answers[aKey]!==undefined;
  const userAns=answers[aKey];
  const st=state.bankStats[aKey];
  let accBadge='';
  if(st&&st.attempts>0){
    const rate=(st.correct/st.attempts*100).toFixed(0);
    const cls=rate>=80?'high':rate>=50?'mid':'low';
    accBadge=`<span class="q-accuracy ${cls}">答${st.attempts}次 · ${rate}%正确</span>`;
  }else if(!answered){
    accBadge=`<span class="q-accuracy none">未做</span>`;
  }
  let h=`<div class="card">`;
  const bmk=isBookmarked(aKey);
  h+=`<div class="q-num" style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">${typeKey==='j'?'判断':''}${typeKey==='s'?'单选':''}${typeKey==='m'?'多选':''}第${idx+1}题${accBadge}<span onclick="toggleBookmark('${aKey}')" style="cursor:pointer;font-size:18px;margin-left:auto;${bmk?'color:#F59E0B':'color:#D1D5DB'}" title="${bmk?'取消收藏':'收藏'}">${bmk?'★':'☆'}</span></div>`;
  h+=`<div class="q-text">${q.q}</div>`;
  
  if(q.type==='j'){
    h+=renderJudge(q,aKey,answered,userAns);
  }else{
    if(q.type==='m')h+=`<div class="multi-hint">💡 多选题，选择所有正确答案后点击确认</div>`;
    h+=renderChoiceOpts(q,aKey,answered,userAns,q.type==='m');
  }
  
  if(answered){
    const isCorrect=checkAnswer(q,userAns);
    const correctText=q.type==='j'?(q.a?'√ 正确':'× 错误'):(Array.isArray(q.a)?q.a.join(', '):q.a);
    h+=`<div class="result-box ${isCorrect?'correct':'wrong'}">${isCorrect?'✅ 回答正确！':'❌ 回答错误！正确答案：'+correctText}</div>`;
    h+=renderExplain(q);
  }
  h+=`</div>`;
  return h;
}

function renderJudge(q,aKey,answered,userAns){
  let h=`<div class="judge-opts">`;
  const tCls=answered?(userAns===true?(q.a===true?'correct':'wrong'):(q.a===true?'missed':'')):'';
  const fCls=answered?(userAns===false?(q.a===false?'correct':'wrong'):(q.a===false?'missed':'')):'';
  h+=`<div class="judge-btn${answered?' disabled':''} ${tCls}${!answered&&userAns===true?' selected':''}" onclick="answerJudge('${aKey}',true)">✓ 正确</div>`;
  h+=`<div class="judge-btn${answered?' disabled':''} ${fCls}${!answered&&userAns===false?' selected':''}" onclick="answerJudge('${aKey}',false)">✗ 错误</div>`;
  h+=`</div>`;
  return h;
}

function renderChoiceOpts(q,aKey,answered,userAns,isMulti){
  let h='';
  const tempSel=isMulti?(window._multiTemp&&window._multiTemp[aKey]||[]):null;
  
  Object.entries(q.opts||{}).sort().forEach(([k,v])=>{
    let cls='opt';
    if(answered){
      cls+=' disabled';
      const correctArr=Array.isArray(q.a)?q.a:[q.a];
      const userArr=Array.isArray(userAns)?userAns:[userAns];
      if(correctArr.includes(k)){
        cls+=userArr.includes(k)?' correct':' missed';
      }else if(userArr.includes(k)){
        cls+=' wrong';
      }
    }else if(isMulti&&tempSel&&tempSel.includes(k)){
      cls+=' selected';
    }else if(!isMulti&&userAns===k){
      cls+=' selected';
    }
    h+=`<div class="${cls}" onclick="${isMulti?`toggleMulti('${aKey}','${k}')`:`answerSingle('${aKey}','${k}')`}"><span class="letter">${k}</span><span>${v}</span></div>`;
  });
  
  if(isMulti&&!answered){
    const cnt=tempSel?tempSel.length:0;
    h+=`<button class="btn btn-pri btn-block confirm-btn" onclick="confirmMulti('${aKey}')" ${cnt<2?'disabled style="opacity:.5"':''}>确认选择 (已选${cnt}项)</button>`;
  }
  return h;
}

function checkAnswer(q,userAns){
  if(q.type==='j')return userAns===q.a;
  if(q.type==='m'){
    const u=[...(userAns||[])].sort().join(',');
    const a=[...(q.a||[])].sort().join(',');
    return u===a;
  }
  return userAns===q.a;
}

  h+=state.examIdx>0?`<button class="btn btn-out btn-sm" onclick="examNav(${state.examIdx-1})">◀ 上一题</button>`:`<div></div>`;
  h+=`<button class="btn ${isMarked?'btn-orange active':'btn-out'} btn-sm" onclick="toggleExamMark(${state.examIdx})">${isMarked?'★ 已标记':'☆ 标记'}</button>`;
  if(state.examIdx<total-1){
    h+=`<button class="btn btn-pri btn-sm" onclick="examNav(${state.examIdx+1})">下一题 ▶</button>`;
  }else{
    h+=`<button class="btn btn-green btn-sm" onclick="submitExam()">交卷 ✓</button>`;
  }
  h+=`</div>`;
  
  // Question navigation dots toggle
  h+=`<div style="text-align:center;margin-top:12px"><button class="btn btn-out btn-sm" onclick="toggleExamNav()">📋 ${state.showExamNav?'收起':'展开'}答题卡</button></div>`;
  if(state.showExamNav){
    // 3-section answer card: Judge(1-40), Single(41-180), Multi(181-190)
    const sections=[{label:'判断题 (1-40)',start:0,end:40},{label:'单选题 (41-180)',start:40,end:180},{label:'多选题 (181-190)',start:180,end:190}];
    sections.forEach(sec=>{
      if(sec.start>=state.examQuestions.length)return;
      const actualEnd=Math.min(sec.end,state.examQuestions.length);
      h+=`<div class="q-nav-section"><div class="section-label">${sec.label}</div><div class="q-nav">`;
      for(let i=sec.start;i<actualEnd;i++){
        const done=state.examAnswers[i]!==undefined;
        const cur=i===state.examIdx;
        const marked=state.examMarked[i];
        h+=`<div class="q-dot${done?' done':''}${cur?' current':''}${marked?' marked':''}" onclick="examNav(${i})">${i+1}</div>`;
      }
      h+=`</div></div>`;
    });
  }
  
  h+=`</div>`;
  return h;
}

function renderExamQuestion(q,idx){
  const aKey=idx;
  const userAns=state.examAnswers[idx];
  let h=`<div class="card">`;
  h+=`<div class="q-num">${q.type==='j'?'判断':q.type==='s'?'单选':'多选'}第${idx+1}题</div>`;
  h+=`<div class="q-text">${q.q}</div>`;
  
  if(q.type==='j'){
    h+=`<div class="judge-opts">`;
    h+=`<div class="judge-btn${userAns===true?' selected':''}" onclick="examAnswerJudge(${idx},true)">✓ 正确</div>`;
    h+=`<div class="judge-btn${userAns===false?' selected':''}" onclick="examAnswerJudge(${idx},false)">✗ 错误</div>`;
    h+=`</div>`;
  }else{
    const isMulti=q.type==='m';
    if(isMulti)h+=`<div class="multi-hint">💡 多选题，选择所有正确答案后点击确认</div>`;
    const tempSel=isMulti?(window._examMultiTemp&&window._examMultiTemp[idx]||userAns||[]):null;
    
    Object.entries(q.opts||{}).sort().forEach(([k,v])=>{
      let cls='opt';
      if(isMulti){
        if(tempSel&&tempSel.includes(k))cls+=' selected';
      }else{
        if(userAns===k)cls+=' selected';
      }
      h+=`<div class="${cls}" onclick="${isMulti?`examToggleMulti(${idx},'${k}')`:`examAnswerSingle(${idx},'${k}')`}"><span class="letter">${k}</span><span>${v}</span></div>`;
    });
    
    if(isMulti){
      const cnt=tempSel?tempSel.length:0;
      h+=`<button class="btn btn-pri btn-block confirm-btn" onclick="examConfirmMulti(${idx})"${cnt<2?' disabled style="opacity:.5"':''}>确认选择 (已选${cnt}项)</button>`;
    }
  }
  h+=`</div>`;
  return h;
}

function getFilteredWrongList(){
  const f=state.wrongFilter;
  if(!f)return state.wrongList;
  if(f==='repeat')return state.wrongList.filter(w=>w.count>2);
  return state.wrongList.filter(w=>w.type===f);
}

function getFilterLabel(){
  const f=state.wrongFilter;
  if(!f)return'全部';
  if(f==='j')return'判断题';
  if(f==='s')return'单选题';
  if(f==='m')return'多选题';
  if(f==='repeat')return'反复错';
  return'';
}

    h+=`</div>`;
    h+=`<div class="card">`;
    h+=`<div class="card-title">★ 我的收藏 (${state.bookmarks.length}题)</div>`;
    h+=`<div style="display:flex;flex-wrap:wrap;gap:6px">`;

  ].map(opt=>`<button class="filter-btn${state.wrongSettings.correctToRemove===opt.v?' active':''}" onclick="setWrongRemoveTarget(${opt.v})">${opt.label}</button>`).join('')}</div>`;
  h+=`<div style="font-size:12px;color:var(--sub);line-height:1.7">当前规则：<b style="color:var(--pri)">${getWrongRetentionLabel()}</b><br>自动存档键：<code>ai3_bankAnswered</code>、<code>ai3_bankStats</code>、<code>ai3_wrong</code>、<code>ai3_examResults</code>、<code>ai3_wrongSettings</code>、<code>ai3_bookmarks</code></div>`;

function renderWrongPractice(){
  // Clean up practiceList: remove keys that no longer exist in wrongList
  state.wrongPracticeList=state.wrongPracticeList.filter(k=>state.wrongList.some(w=>w.key===k));
  if(state.wrongPracticeList.length===0){
    state.wrongMode=false;
    return renderWrong();
  }
  const pList=state.wrongPracticeList;
  const realIdx=state.wrongIdx%pList.length;
  const w=state.wrongList.find(ww=>ww.key===pList[realIdx]);
  if(!w){state.wrongMode=false;return renderWrong();}
  const idx=state.wrongIdx;
  const aKey=w.key;
  const answered=state.wrongAnswered[aKey]!==undefined;
  const userAns=state.wrongAnswered[aKey];

  let h=`<div class="container fade-in">`;
  h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;color:var(--sub)">错题练习 ${idx+1}/${pList.length}${state.wrongFilter?' · '+getFilterLabel():''}</span><button class="btn btn-out btn-sm" onclick="exitWrongMode()">返回</button></div><div class="progress-bar"><div class="progress-fill" style="width:${((idx+1)/pList.length*100).toFixed(1)}%"></div></div></div>`;
  
  h+=`<div class="card">`;
  h+=`<div class="q-num"><span class="badge ${w.type==='j'?'badge-j':w.type==='s'?'badge-s':'badge-m'}">${w.type==='j'?'判断':w.type==='s'?'单选':'多选'}</span> 错${w.count}次</div>`;
  h+=`<div class="q-text">${w.q}</div>`;
  h+=`<div style="font-size:12px;color:var(--sub);margin-bottom:10px">${getWrongProgressText(w)}</div>`;
  
  if(w.type==='j'){
    h+=`<div class="judge-opts">`;
    const tCls=answered?(userAns===true?(w.a===true?'correct':'wrong'):(w.a===true?'missed':'')):'';
    const fCls=answered?(userAns===false?(w.a===false?'correct':'wrong'):(w.a===false?'missed':'')):'';
    h+=`<div class="judge-btn${answered?' disabled':''} ${tCls}" onclick="wrongAnswer('${aKey}',true,'j')">✓ 正确</div>`;
    h+=`<div class="judge-btn${answered?' disabled':''} ${fCls}" onclick="wrongAnswer('${aKey}',false,'j')">✗ 错误</div>`;
    h+=`</div>`;
  }else{
    const isMulti=w.type==='m';
    if(isMulti)h+=`<div class="multi-hint">💡 多选题</div>`;
    const tempSel=isMulti?(window._wrongMultiTemp&&window._wrongMultiTemp[aKey]||[]):null;
    
    Object.entries(w.opts||{}).sort().forEach(([k,v])=>{
      let cls='opt';
      if(answered){
        cls+=' disabled';
        const ca=Array.isArray(w.a)?w.a:[w.a];
        const ua=Array.isArray(userAns)?userAns:[userAns];
        if(ca.includes(k))cls+=ua.includes(k)?' correct':' missed';
        else if(ua.includes(k))cls+=' wrong';
      }else if(isMulti&&tempSel&&tempSel.includes(k)){
        cls+=' selected';
      }
      h+=`<div class="${cls}" onclick="${isMulti?`wrongToggleMulti('${aKey}','${k}')`:`wrongAnswer('${aKey}','${k}','s')`}"><span class="letter">${k}</span><span>${v}</span></div>`;
    });
    
    if(isMulti&&!answered){
      const cnt=tempSel?tempSel.length:0;
      h+=`<button class="btn btn-pri btn-block confirm-btn" onclick="wrongConfirmMulti('${aKey}')"${cnt<2?' disabled style="opacity:.5"':''}>确认 (已选${cnt})</button>`;
    }
  }
  
  if(answered){
    const isCorrect=w.type==='j'?userAns===w.a:w.type==='m'?[...(userAns||[])].sort().join(',')===[...(w.a||[])].sort().join(','):userAns===w.a;
    const correctText=w.type==='j'?(w.a?'√ 正确':'× 错误'):(Array.isArray(w.a)?w.a.join(', '):w.a);
    if(isCorrect){
      h+=`<div class="result-box correct">✅ 回答正确！${getWrongRemoveTarget()===0?`当前为手动移除模式，题目仍保留在错题本。`:`已累计答对${Math.max(0,Number(w.correctStreak)||0)}/${getWrongRemoveTarget()}次，达到阈值后才会自动移出错题本。`}</div>`;
      h+=renderExplain(w);
    }else{
      h+=`<div class="result-box wrong">❌ 回答错误！正确答案：${correctText}</div>`;
      h+=renderExplain(w);
    }
  }
  h+=`<div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn btn-out btn-sm" onclick="removeWrongManual('${aKey}')">手动移出</button></div>`;
  h+=`</div>`;
  
  h+=`<div class="nav-btns">`;
  h+=idx>0?`<button class="btn btn-out btn-sm" onclick="wrongNav(-1)">◀ 上一题</button>`:`<div></div>`;
  h+=idx<pList.length-1?`<button class="btn btn-pri btn-sm" onclick="wrongNav(1)">下一题 ▶</button>`:`<button class="btn btn-green btn-sm" onclick="exitWrongMode()">完成</button>`;
  h+=`</div></div>`;
  return h;
}

// Event handlers
window.switchTab=function(t){state.tab=t;render();}
window.switchBankType=function(t){state.bankType=t;state.bankPage=0;render();}
window.bankPage=function(p){state.bankPage=p;render();window.scrollTo(0,0);}

window.resetBankProgress=function(){
  if(!confirm(`确认重置【${state.bankType==='j'?'判断题':state.bankType==='s'?'单选题':'多选题'}】的所有做题记录？\n（不影响错题本和模拟考试记录）`))return;
  const type=state.bankType;
  // Remove all entries for this type
  Object.keys(state.bankAnswered).forEach(k=>{if(k.startsWith(type+'_'))delete state.bankAnswered[k];});
  Object.keys(state.bankStats).forEach(k=>{if(k.startsWith(type+'_'))delete state.bankStats[k];});
  LS.set('bankAnswered',state.bankAnswered);
  LS.set('bankStats',state.bankStats);
  state.bankPage=0;
  render();
}

window.resetPageProgress=function(){
  const type=state.bankType;
  const list=bank[type];
  const PAGE=20;
  const totalPages=Math.ceil(list.length/PAGE);
  const page=Math.min(state.bankPage,totalPages-1);
  const start=page*PAGE;
  const end=Math.min(start+PAGE,list.length);
  if(!confirm(`确认重置当前页（第${start+1}-${end}题）的做题记录？`))return;
  for(let i=start;i<end;i++){
    const k=type+'_'+i;
    delete state.bankAnswered[k];
    delete state.bankStats[k];
    if(window._multiTemp)delete window._multiTemp[k];
  }
  LS.set('bankAnswered',state.bankAnswered);
  LS.set('bankStats',state.bankStats);
  render();
}

function saveBankProgress(aKey,isCorrect){
  // Save answers
  LS.set('bankAnswered',state.bankAnswered);
  // Update stats
  if(!state.bankStats[aKey])state.bankStats[aKey]={attempts:0,correct:0};
  state.bankStats[aKey].attempts++;
  if(isCorrect)state.bankStats[aKey].correct++;
  LS.set('bankStats',state.bankStats);
}

window.answerJudge=function(aKey,val){
  if(state.bankAnswered[aKey]!==undefined)return; // already answered
  state.bankAnswered[aKey]=val;
  const[type,idx]=aKey.split('_');
  const q=bank[type][parseInt(idx)];
  const isCorrect=val===q.a;
  saveBankProgress(aKey,isCorrect);
  if(!isCorrect)addWrong(q,val,type,idx);
  else removeWrong(aKey);
  render();
}

window.answerSingle=function(aKey,val){
  if(state.bankAnswered[aKey]!==undefined)return;
  state.bankAnswered[aKey]=val;
  const[type,idx]=aKey.split('_');
  const q=bank[type][parseInt(idx)];
  const isCorrect=val===q.a;
  saveBankProgress(aKey,isCorrect);
  if(!isCorrect)addWrong(q,val,type,idx);
  else removeWrong(aKey);
  render();
}

window._multiTemp=window._multiTemp||{};
window.toggleMulti=function(aKey,val){
  if(!window._multiTemp[aKey])window._multiTemp[aKey]=[];
  const arr=window._multiTemp[aKey];
  const i=arr.indexOf(val);
  if(i>=0)arr.splice(i,1);else arr.push(val);
  render();
}

window.confirmMulti=function(aKey){
  if(state.bankAnswered[aKey]!==undefined)return;
  const sel=window._multiTemp[aKey]||[];
  state.bankAnswered[aKey]=[...sel].sort();
  const[type,idx]=aKey.split('_');
  const q=bank[type][parseInt(idx)];
  const isCorrect=checkAnswer(q,state.bankAnswered[aKey]);
  saveBankProgress(aKey,isCorrect);
  if(!isCorrect)addWrong(q,state.bankAnswered[aKey],type,idx);
  else removeWrong(aKey);
  delete window._multiTemp[aKey];
  render();
}

// Exam functions
window.startExam=function(id){
  state.examId=id;
  state.examInstanceId=Date.now();
  state.examAnswers={};
  state.examIdx=0;
  state.examTimer=90*60;
  state.showExamNav=false;
  state.examMarked={};
  window._examMultiTemp={};

  if(id===-1){
    // Official exam
    state.examQuestions=[...exam.j,...exam.s,...exam.m];
  }else{
    state.examQuestions=generateExam();
  }
  
  state.examActive=true;
  if(state.examTimerRef)clearInterval(state.examTimerRef);
  state.examTimerRef=setInterval(()=>{
    state.examTimer--;
    if(state.examTimer<=0){clearInterval(state.examTimerRef);submitExam();}
    else{
      const mins=Math.floor(state.examTimer/60);
      const secs=state.examTimer%60;
      const el=document.querySelector('.timer');
      if(el){
        el.textContent=String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
        if(state.examTimer<300)el.classList.add('warn');
      }
    }
  },1000);
  render();
}

window.examNav=function(i){state.examIdx=i;render();}
window.toggleExamNav=function(){state.showExamNav=!state.showExamNav;render();}

window.submitExam=function(){
  if(!confirm('确认交卷？'))return;
  clearInterval(state.examTimerRef);
  const result=calcScore(state.examQuestions,state.examAnswers);

  // Record wrong answers with timestamp-based keys
  state.examQuestions.forEach((q,i)=>{
    const ua=state.examAnswers[i];
    if(ua===undefined)return;
    if(!checkAnswer(q,ua)){
      const key='exam_'+state.examInstanceId+'_'+i;
      const existing=state.wrongList.findIndex(w=>w.key===key);
      if(existing<0){
        state.wrongList.push({key,type:q.type,q:q.q,opts:q.opts,a:q.a,userAns:ua,count:1,ts:Date.now()});
      }
    }
  });
  LS.set('wrong',state.wrongList);

  // Show result first
  const pass=result.score>=60;
  alert(`考试结束！\n\n得分：${result.score.toFixed(1)} 分\n正确：${result.correct} 题\n错误：${result.wrong} 题\n未答：${result.total-result.correct-result.wrong} 题\n\n${pass?'🎉 恭喜通过！':'😤 未通过，继续加油！'}\n(60分及格)`);

  // Ask to save full exam
  const r={examId:state.examId,score:result.score,correct:result.correct,wrong:result.wrong,total:result.total,ts:Date.now()};
  if(confirm('是否保存完整试卷以便日后回顾？\n选"确定"保存完整试卷，选"取消"仅记录分数。')){
    r.questions=state.examQuestions;
    r.answers={...state.examAnswers};
    r.marked={...state.examMarked};
  }
  state.examResults.push(r);
  LS.set('examResults',state.examResults);

  state.examActive=false;
  state.examReview=false;
  state.tab=1;
  render();
}

function renderExamReview(){
  const r=state.examReviewData;
  const q=r.questions[state.examIdx];
  const total=r.questions.length;
  const ua=r.answers[state.examIdx];
  const isCorrect=ua!==undefined?checkAnswer(q,ua):false;

  let h=`<div class="header header-wrap"><div class="back-btn" onclick="exitExamReview()">✕</div><h1>试卷回顾</h1><div class="sub">第${state.examIdx+1}/${total}题 · ${r.score.toFixed(1)}分</div></div>`;
  h+=`<div class="container fade-in">`;

  // Question with result
  h+=`<div class="card ${ua===undefined?'review-unanswered':isCorrect?'review-correct':'review-wrong'}">`;
  h+=`<div class="q-num">${q.type==='j'?'判断':q.type==='s'?'单选':'多选'}第${state.examIdx+1}题${r.marked&&r.marked[state.examIdx]?' <span style="color:var(--orange)">★ 已标记</span>':''}</div>`;
  h+=`<div class="q-text">${q.q}</div>`;

  if(q.type==='j'){
    h+=`<div class="judge-opts">`;
    const tCls=ua!==undefined?(ua===true?(q.a===true?'correct':'wrong'):(q.a===true?'missed':'')):'';
    const fCls=ua!==undefined?(ua===false?(q.a===false?'correct':'wrong'):(q.a===false?'missed':'')):'';
    h+=`<div class="judge-btn disabled ${tCls}">✓ 正确</div>`;
    h+=`<div class="judge-btn disabled ${fCls}">✗ 错误</div>`;
    h+=`</div>`;
  }else{
    Object.entries(q.opts||{}).sort().forEach(([k,v])=>{
      let cls='opt disabled';
      const correctArr=Array.isArray(q.a)?q.a:[q.a];
      const userArr=ua?(Array.isArray(ua)?ua:[ua]):[];
      if(correctArr.includes(k)){cls+=userArr.includes(k)?' correct':' missed';}
      else if(userArr.includes(k)){cls+=' wrong';}
      h+=`<div class="${cls}"><span class="letter">${k}</span><span>${v}</span></div>`;
    });
  }

  const correctText=q.type==='j'?(q.a?'√ 正确':'× 错误'):(Array.isArray(q.a)?q.a.join(', '):q.a);
  if(ua===undefined){h+=`<div class="result-box wrong">⚠️ 未作答。正确答案：${correctText}</div>`;}
  else if(isCorrect){h+=`<div class="result-box correct">✅ 回答正确</div>`;}
  else{h+=`<div class="result-box wrong">❌ 回答错误。正确答案：${correctText}</div>`;}
  h+=renderExplain(q);
  h+=`</div>`;

  // Navigation
  h+=`<div class="nav-btns">`;
  h+=state.examIdx>0?`<button class="btn btn-out btn-sm" onclick="reviewNav(${state.examIdx-1})">◀ 上一题</button>`:`<div></div>`;
  h+=state.examIdx<total-1?`<button class="btn btn-pri btn-sm" onclick="reviewNav(${state.examIdx+1})">下一题 ▶</button>`:`<button class="btn btn-green btn-sm" onclick="exitExamReview()">返回</button>`;
  h+=`</div>`;

  // 3-section nav
  h+=`<div style="text-align:center;margin-top:12px"><button class="btn btn-out btn-sm" onclick="toggleExamNav()">📋 ${state.showExamNav?'收起':'展开'}答题卡</button></div>`;
  if(state.showExamNav){
    const sections=[{label:'判断题 (1-40)',start:0,end:40},{label:'单选题 (41-180)',start:40,end:180},{label:'多选题 (181-190)',start:180,end:190}];
    sections.forEach(sec=>{
      if(sec.start>=total)return;
      const actualEnd=Math.min(sec.end,total);
      h+=`<div class="q-nav-section"><div class="section-label">${sec.label}</div><div class="q-nav">`;
      for(let i=sec.start;i<actualEnd;i++){
        const d=r.answers[i]!==undefined;
        const ic=d?checkAnswer(r.questions[i],r.answers[i]):false;
        const cur=i===state.examIdx;
        const marked=r.marked&&r.marked[i];
        h+=`<div class="q-dot${d?(ic?' done':' wrong-dot'):''}${cur?' current':''}${marked?' marked':''}" onclick="reviewNav(${i})">${i+1}</div>`;
      }
      h+=`</div></div>`;
    });
  }

  h+=`</div>`;
  return h;
}

// ========== Cloud Sync via GitHub Gist ==========
const GIST_DESC='ai3-quiz-save';
const SYNC_TOKEN_KEY='ai3_gh_token';
const GIST_ID_KEY='ai3_gist_id';

function getSyncToken(){return LS.get(SYNC_TOKEN_KEY,'')}
function setSyncToken(t){LS.set(SYNC_TOKEN_KEY,t)}
function getGistId(){return LS.get(GIST_ID_KEY,'')}
function setGistId(id){LS.set(GIST_ID_KEY,id)}

async function gistHeaders(){
  const token=getSyncToken();
  return{'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'Content-Type':'application/json'};
}

async function findGist(){
  const token=getSyncToken();
  if(!token)return null;
  try{
    const res=await fetch('https://api.github.com/gists',{headers:await gistHeaders()});
    if(!res.ok){console.error('findGist failed:',res.status,await res.text());return null;}
    const gists=await res.json();
    const found=gists.find(g=>g.description===GIST_DESC);
    if(found){setGistId(found.id);return found.id;}
    return null;
  }catch(e){console.error('findGist error:',e);return null;}
}

async function createGist(saveData){
  const res=await fetch('https://api.github.com/gists',{
    method:'POST',
    headers:await gistHeaders(),
    body:JSON.stringify({description:GIST_DESC,public:false,files:{'save.json':{content:JSON.stringify(saveData)}}})
  });
  if(!res.ok)throw new Error('创建 Gist 失败');
  const g=await res.json();
  setGistId(g.id);
  return g.id;
}

async function readGist(gistId){
  const res=await fetch(`https://api.github.com/gists/${gistId}`,{headers:await gistHeaders()});
  if(!res.ok){const t=await res.text();throw new Error('读取失败 '+res.status+': '+t);}
  const g=await res.json();
  const file=g.files&&g.files['save.json'];
  if(!file)throw new Error('Gist 中无 save.json');
  return JSON.parse(file.content);
}

async function updateGist(gistId,saveData){
  const res=await fetch(`https://api.github.com/gists/${gistId}`,{
    method:'PATCH',
    headers:await gistHeaders(),
    body:JSON.stringify({files:{'save.json':{content:JSON.stringify(saveData)}}})
  });
  if(!res.ok){const t=await res.text();throw new Error('更新失败 '+res.status+': '+t);}
}

function renderKnowledgeBase() {
  const categories = {};
  Object.entries(KB).forEach(([id, entry]) => {
    if (!categories[entry.category]) categories[entry.category] = [];
    categories[entry.category].push({id, ...entry});
  });
  let h = '<div style="padding:0 0 16px">';
  Object.entries(categories).forEach(([cat, entries]) => {
    h += `<div style="margin-bottom:16px"><h4 style="margin:0 0 8px;color:#1e40af;font-size:14px;border-bottom:2px solid #3B82F6;padding-bottom:4px">${cat}（${entries.length}）</h4>`;
    entries.forEach(e => {
      h += `<div style="padding:8px 12px;margin-bottom:6px;background:#F9FAFB;border-radius:8px;cursor:pointer;border-left:3px solid #3B82F6" onclick="showKBModal('${e.id}')">
        <div style="font-weight:600;font-size:13px;color:#1e3a5f">${e.title}</div>
        <div style="font-size:12px;color:#6b7280;margin-top:2px">${e.content.substring(0, 60)}...</div>
      </div>`;
    });
    h += '</div>';
  });
  h += '</div>';
  return h;
}
